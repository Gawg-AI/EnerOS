name: nightly-fuzz

# v0.250.0（C-250）初版 + 29 GV-04/GV-17 修真：
# - 深 fuzz 从 PRNG driver（500k 固定输入序列）改为真 libFuzzer harness，
#   消费 fuzz/corpus/ 语料，-max_total_time=5400 每面；
# - 崩溃语料归档条件 `if: failure()` → `if: always()`（job 被 cancel/超时
#   时语料不再丢失），if-no-files-found: ignore 保持不变。

on:
  schedule:
    # 每天 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzz-deep:
    runs-on: ubuntu-22.04
    # 9 面 × 2100s + 取装开销；GitHub 托管 runner 单作业硬上限 360 分钟。
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          # 复查轮修复：@nightly-2026-04-04 标签在 dtolnay 仓库不存在（零 dated tag，
          # gh run 33351052897 实证 setup 层死）——改钉 master SHA + toolchain 入参，
          # 与 rust-toolchain.toml 的 nightly-2026-04-04 保持同源钉版。
          toolchain: nightly-2026-04-04
          components: rust-src
          targets: aarch64-unknown-none

      - name: Cargo fetch locked
        run: cargo fetch --locked

      # SPEC-SERIES-2026-08-27/F（WP-F.3）：三新靶 points/toml_compile/mqtt_packet
      # 入列（GAP-FUZZ 三件套，fuzz/Cargo.toml 已入库）；时间预算按 9 靶重排：
      # 9 × 2100s = 315 分钟 ≤ 本作业 330 分钟上限 ≤ GitHub 托管 runner 单作业
      # 6 小时硬上限——旧参 5400s×N 在任何 N≥3 时物理上无法收尾，如实换算。
      - name: Deep fuzz 9 parse surfaces (libFuzzer, 2100s each)
        id: fuzz
        run: |
          cargo install cargo-fuzz --locked
          set +e
          FAILED=""
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader points toml_compile mqtt_packet; do
            echo "=== deep fuzz: $t ==="
            cd fuzz
            cargo +nightly-2026-04-04 fuzz run fuzz_$t corpus/$t/ -- -timeout=60 -max_total_time=2100
            rc=$?
            cd ..
            if [ $rc -ne 0 ]; then
              FAILED="$FAILED $t"
            fi
          done
          set -e
          if [ -n "$FAILED" ]; then
            echo "crash-targets=$FAILED" >> "$GITHUB_OUTPUT"
            echo "DEEP FUZZ FAILED on:$FAILED" >&2
            exit 1
          fi
          echo "DEEP FUZZ ALL PASS"

      - name: Archive crash corpus (if any)
        # GV-17：`if: always()`——崩溃归档不得因 job 提前结束（cancel/超时）
        # 而丢失；无语料时 ignore。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-corpus
          path: |
            fuzz/corpus/**/*
            target/fuzz-crashes/**/*
          if-no-files-found: ignore
