name: nightly-fuzz

# v0.250.0（C-250）初版 + 29 GV-04/GV-17 修真：
# - 深 fuzz 从 PRNG driver（500k 固定输入序列）改为真 libFuzzer harness，
#   消费 fuzz/corpus/ 语料，-max_total_time=5400 每面；
# - 崩溃语料归档条件 `if: failure()` → `if: always()`（job 被 cancel/超时
#   时语料不再丢失），if-no-files-found: ignore 保持不变。

on:
  schedule:
    # 每天 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  fuzz-deep:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src
          targets: aarch64-unknown-none

      - name: Cargo fetch locked
        run: cargo fetch --locked

      - name: Deep fuzz 6 parse surfaces (libFuzzer, 5400s each, GV-04)
        id: fuzz
        run: |
          cargo install cargo-fuzz --locked
          set +e
          FAILED=""
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader; do
            echo "=== deep fuzz: $t ==="
            cd fuzz
            cargo +nightly-2026-04-04 fuzz run fuzz_$t corpus/$t/ -- -timeout=60 -max_total_time=5400
            rc=$?
            cd ..
            if [ $rc -ne 0 ]; then
              FAILED="$FAILED $t"
            fi
          done
          set -e
          if [ -n "$FAILED" ]; then
            echo "crash-targets=$FAILED" >> "$GITHUB_OUTPUT"
            echo "DEEP FUZZ FAILED on:$FAILED" >&2
            exit 1
          fi
          echo "DEEP FUZZ ALL PASS"

      - name: Archive crash corpus (if any)
        # GV-17：`if: always()`——崩溃归档不得因 job 提前结束（cancel/超时）
        # 而丢失；无语料时 ignore。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-corpus
          path: |
            fuzz/corpus/**/*
            target/fuzz-crashes/**/*
          if-no-files-found: ignore
