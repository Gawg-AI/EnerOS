name: EnerOS formal baseline

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SOURCE_DATE_EPOCH: "1785465257"
  ENEROS_RELEASE_PUBLIC_KEY_HEX: "8e5150375a22ae2ad55ea85a3e7a8faee8196315a413163fd4778c82c59af9a7"
  ENEROS_RELEASE_KEY_ID_HEX: "4e28c578ebd8c3c68b83ff1d0b1a16df"
  ENEROS_PLATFORM_ID_HEX: "6afc39cf058a1ca52a5e36d8eefa1463"

jobs:
  g0-fail-closed:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Fetch locked materials
        run: cargo fetch --locked

      - name: Prove offline locked resolution
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Product profile and forbidden-closure audit
        run: cargo xtask audit all

      - name: Unsafe SAFETY comment coverage (C-243 gate)
        run: cargo xtask audit-unsafe-safety

      # 蓝图 66 WP-66.4.1（体检 C8 / R-64.c 固化）：feature 面测试矩阵——
      # feature-gated 测试在裸 cargo test 下静默跳过，本门逐项带特征实跑
      # （清单+完备性自检内嵌 xtask qa feature-matrix）。
      - name: Feature-face test matrix (blueprint 66 C8 gate)
        run: cargo xtask qa feature-matrix

      # 蓝图 67 WP-67.1.2（体检 A3 接电）：sign-key-discipline 静态门进 CI
      # ——蓝图 66 C4 配套门此前只活在本地 opt-in 的 pre-commit，CI 从不
      # 扫真实仓库；门本体已自 eneros-ci 迁 xtask（WP-67.1.1 单源化）。
      - name: Sign-key discipline gate (blueprint 67 A3 gate)
        run: cargo xtask qa gate sign-keys

      - name: BumpAllocator loom concurrency model (C-243 gate)
        run: cargo test --locked -p eneros-services --features loom --lib loom_allocator

      - name: "Concurrency loom models (C-247 gate: account/p2p-match/metrics/telemetry-queue)"
        run: |
          cargo test --locked -p eneros-account --features loom --lib loom_freeze
          cargo test --locked -p eneros-p2p-match --features loom --lib loom_orderbook
          cargo test --locked -p eneros-metrics --features loom --lib loom_increment
          cargo test --locked -p eneros-telemetry-queue --features loom --lib loom_queue

      # 33 OB-07（复验）：FileStorage/FileMetricsStore 的 std feature 门控后端
      # 此前不在任何 CI 步骤启用——整条端到端导出链（record→flush→JSONL 读回）
      # 永不编译/运行，回归静默漏过。与 loom 步骤同模式显式启用。
      - name: Observability file-export e2e (33 OB-07 gate - logging/metrics --features std)
        run: |
          cargo test --locked -p eneros-logging --features std
          cargo test --locked -p eneros-metrics --features std

      - name: Intra-doc link integrity (C-249 gate)
        run: |
          set -euo pipefail
          set +e
          OUT=$(cargo doc --workspace --no-deps 2>&1)
          RC=$?
          set -e
          COUNT=$(echo "$OUT" | awk '/unresolved link/{n++} END{print n+0}')
          if [ "$COUNT" -ne 0 ]; then
            echo "$OUT" | grep -B1 -A4 "unresolved link" | head -80
            echo "FAIL: $COUNT unresolved intra-doc links" >&2
            exit 1
          fi
          echo "rustdoc: 0 unresolved links"

      - name: seL4 kernel toolchain cache (restore)
        # 2026-09-23：key bump 强制冷路径重跑——seL4 补丁面改收敛器
        # （sel4-converge-patches.sh）+ overlay/IMAGE_START_ADDR/UTIL_LIBS
        # 旗标进脚本后，旧缓存命中短路曾让构建脚本修复永不被 CI 执行。
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.339.0-converge

      - name: Build seL4 kernel + root image (ADR-0023, KRN-006)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: root-task production feature profile compiles (70.7 P0 lock)
        run: |
          # 70.7 复查：qemu-test-synth 门控的仅有探针调用点曾无门控 → 生产
          # profile（sel4-eipc 无 qemu-test-synth：qemu-prod/qemu-prod-sv2/
          # board-prod/recovery/factory）E0599 编译断裂。出口门只构建
          # qemu-test，`xtask build all` 对 sel4: 选择器提前返回——两处均
          # 未覆盖。本步钉死生产特征集在 aarch64-none 目标可编译（与镜像
          # 工厂 image_factory.rs 的特征解析同源）。
          export PATH="${{ runner.tool_cache }}/sel4/xpack-aarch64-none-elf-gcc-15.2.1-1.1/bin:$PATH"
          cargo check --locked --offline -p eneros-root-task \
            --target aarch64-unknown-none --features sel4-eipc

      - name: QEMU seL4 boot evidence (eneros.sel4.v1, fail-closed)
        run: |
          set -euo pipefail
          if [ ! -f target/sel4/eneros-root-image-arm-qemu-arm-virt ]; then
            echo "target/sel4/eneros-root-image-arm-qemu-arm-virt missing (seL4 build skipped?)" >&2
            exit 1
          fi
          set +e
          # canonical 启动（root_task.c:12-14 / docs/sel4/milestone-g3-sel4.md）：
          # G3 套件需要 virtio-rng/blk/net 三设备，缺任一 → bus-enum FAIL；
          # virtio-net RX 必须由外部 peer 经 socket 后端主动发帧（root_task.c:2451），
          # user 模式网卡无 peer 注入 → virtio-net-rx FAIL，故用 socket + sel4-net-peer.py。
          truncate -s 16M target/sel4/disk.raw
          timeout 120 qemu-system-aarch64 -machine virt,gic-version=3,secure=off -cpu cortex-a57 \
            -smp 4 -m 1024M -nographic \
            -device virtio-rng-device \
            -device virtio-blk-device,drive=d0 -drive file=target/sel4/disk.raw,if=none,id=d0,format=raw,cache=none \
            -netdev socket,id=n0,listen=127.0.0.1:5577 \
            -device virtio-net-device,netdev=n0,mac=52:54:00:12:34:56 \
            -kernel target/sel4/eneros-root-image-arm-qemu-arm-virt \
            > target/qemu-sel4-boot.log 2>&1 &
          QEMU_PID=$!
          sleep 2
          PEER_RC=0
          python3 tools/sel4-net-peer.py > target/sel4-net-peer.log 2>&1 || PEER_RC=$?
          if [ "$PEER_RC" -ne 0 ]; then
            # peer 失败不掩盖 QEMU 结果（root_task 会如实 emit virtio-net-rx/tx FAIL，
            # 下方 FAIL grep 是硬门禁）；但必须可观察，避免 RX/TX 证据静默缺失。
            echo "sel4-net-peer rc=$PEER_RC (RX/TX 证据依赖 peer；root 侧 FAIL 自报为硬门禁)" >&2
          fi
          wait "$QEMU_PID"
          rc=$?
          set -e
          # 36 WP-36.10（security review 收尾）：root_task 永不退出，timeout(124)
          # 是预期终止方式，但必须以 evidence-complete 哨兵证明证据采集完成；
          # 无哨兵的 124 = NO_RESULT = FAIL（GV-07 止血，禁止 timeout 容忍）。
          # security-review MEDIUM：rc==0 也必须确认哨兵在场（杜绝"正常退出
          # 但证据未完整"的假绿——root 跑完即 emit 哨兵，缺哨兵即流程不完整）。
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "QEMU seL4 boot failed with exit $rc" >&2
            cat target/qemu-sel4-boot.log >&2
            exit 1
          fi
          if ! grep -q '"test":"evidence-complete","result":"PASS"' target/qemu-sel4-boot.log; then
            echo "QEMU seL4 boot WITHOUT evidence-complete sentinel (NO_RESULT, rc=$rc)" >&2
            tail -40 target/qemu-sel4-boot.log >&2
            exit 1
          fi
          for t in sel4-kernel-init bootinfo-valid cap-create ipc-loopback root-heartbeat; do
            if ! grep -q "\"test\":\"$t\",\"result\":\"PASS\"" target/qemu-sel4-boot.log; then
              echo "QEMU seL4 evidence missing PASS for $t" >&2
              exit 1
            fi
          done
          if grep -q '"result":"FAIL"' target/qemu-sel4-boot.log; then
            echo "QEMU seL4 boot log contains FAIL result" >&2
            grep '"result":"FAIL"' target/qemu-sel4-boot.log >&2
            exit 1
          fi
          echo "QEMU seL4 boot: 5/5 PASS"

      - name: Build every declared profile through the single entry
        run: cargo xtask build all

      - name: Formal xtask unit tests
        run: cargo xtask test unit

      - name: CI policy scan
        run: cargo xtask test ci-policy

      - name: Skip timeout and child-failure mutations
        run: cargo xtask test gate-semantics

      - name: Boot format and loader tests
        run: cargo test --locked -p eneros-boot-protocol -p eneros-image-format -p eneros-boot-manager-uefi

      - name: Verify frozen Cargo graph and binary BOM
        shell: pwsh
        # -ExternalBinary：sel4 elfloader 为 C 构建产物（非 cargo workspace
        # 二进制），闭包为空；binary-boms.json 须含其条目（release sbom 依赖）。
        run: tools/delivery/cargo-closure.ps1 -VerifyDirectory product/closure -Repository . -ExternalBinary sel4:elfloader-arm-qemu-arm-virt

      - name: Forbidden package mutation must fail
        shell: bash
        run: |
          if cargo xtask audit profile qemu-prod --fault-inject-package mockall; then
            echo "forbidden package mutation was accepted" >&2
            exit 1
          fi

      - name: Legacy entrypoints must fail
        shell: bash
        run: |
          if make; then
            echo "legacy Makefile was accepted" >&2
            exit 1
          fi
          if tools/flash.sh --help; then
            echo "legacy flash script was accepted" >&2
            exit 1
          fi

      - name: VRF-002 dual-build byte comparison (bit-identical payload)
        run: cargo xtask build-compare

      - name: "42 reproducibility EvidenceEnvelope report (role-specific semantic gate)"
        run: |
          cargo xtask evidence42 repro --out target/repro.json
          cargo xtask evidence42 report-gate --kind repro --path target/repro.json

  evidence42-portable-tools:
    name: Evidence42 portable tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Fetch locked materials
        shell: bash
        run: cargo fetch --locked

      - name: Candidate lineage on current tree
        shell: bash
        run: cargo xtask evidence42 lineage --profile qemu-prod --artifact Cargo.lock

      - name: Evidence envelope mutation suite (12 cases must red)
        shell: bash
        run: cargo xtask evidence42 mutation

      - name: Envelope create + verify + gate
        shell: bash
        run: |
          ART_SHA=$(sha256sum Cargo.lock | cut -d' ' -f1)
          cargo xtask evidence42 envelope --lineage target/eneros/evidence/42/candidate-lineage.json --test-id ci-portable --scope L2 --command "cargo xtask run qemu-prod --expect PASS" --oracle "qmp exit=0 ready=all readback=ok" --positive "boot:PASS:qemu_exit=0 ready=all" --negative "bad-sig:FAIL:rejected" --verdict PASS --artifact "Cargo.lock:Cargo.lock:$ART_SHA" --out target/eneros/evidence/42/ci-portable.json
          cargo xtask evidence42 verify target/eneros/evidence/42/ci-portable.json
          cargo xtask evidence42 gate target/eneros/evidence/42/ci-portable.json
          cargo xtask evidence42 lineage-check --envelope target/eneros/evidence/42/ci-portable.json --artifact Cargo.lock

      - name: Fuzz smoke report + role-specific gate (portable)
        shell: bash
        run: |
          cargo xtask evidence42 fuzz-report --iterations 100 --out target/fuzz-smoke.json
          cargo xtask evidence42 report-gate --kind fuzz --path target/fuzz-smoke.json

      - name: Unsafe audit report (non-release info; current FAIL is visible)
        shell: bash
        run: |
          cargo xtask evidence42 unsafe-report --allow-non-pass --out target/unsafe-audit.json
          cargo xtask evidence42 report-gate --kind unsafe --path target/unsafe-audit.json --allow-non-pass

      - name: Media artifact check (BLOCKED/FAIL allowed as info in non-release)
        shell: bash
        run: cargo xtask evidence42 media-check --allow-non-pass

  catalog-gate-43:
    name: Catalog / SKU qualification gate (blueprint 43)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Fetch locked materials
        run: cargo fetch --locked

      # WP-43.1/43.15：兼容性目录派生、签名、校验与机器 Gate。目录只列
      # 已验证组合（status=qualified 必须有绑定当前候选的 L4 证据——
      # 当前仓库诚实状态为零个 qualified SKU）。
      - name: Catalog derive + sign + validate
        run: |
          cargo xtask catalog derive
          cargo xtask catalog sign
          cargo xtask catalog validate

      # evidence42 check-current（catalog gate 的 42 前置）要求 evidence/42
      # 存在绑定当前候选的信封。CI 干净检出无本地证据——先按
      # evidence42-portable-tools 同款手法创建当前候选证据信封再跑 Gate。
      - name: Bind current-candidate evidence envelope (CI)
        run: |
          cargo xtask evidence42 lineage --profile qemu-prod --artifact Cargo.lock --out target/eneros/evidence/42/lineage-ci-catalog.json
          ART_SHA=$(sha256sum Cargo.lock | cut -d' ' -f1)
          cargo xtask evidence42 envelope --lineage target/eneros/evidence/42/lineage-ci-catalog.json --test-id ci-catalog-current --scope L2 --command "cargo xtask catalog gate" --oracle "catalog-gate current-candidate evidence pass" --positive "catalog:PASS:catalog_consistent_skus_enumerated" --negative "stale:FAIL:old-candidate-envelope-rejected" --verdict PASS --artifact "Cargo.lock:Cargo.lock:$ART_SHA" --out evidence/42/ci-catalog-current.json
          cargo xtask evidence42 verify evidence/42/ci-catalog-current.json
          cargo xtask evidence42 gate evidence/42/ci-catalog-current.json

      - name: Catalog machine gate (43 WP-43.15)
        run: cargo xtask catalog gate

      # WP-43.2：新平台接入 PR 不得修改 forbidden core paths（Agent/AI/
      # 控制/协议状态机/安全模型/产品装配）。PR 以 base sha 为 diff 基准；
      # 直推主分支首推没有 before ref 时由静态 catalog gate 兜底。
      - name: Platform admission diff gate
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            cargo xtask catalog platform-gate --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          else
            cargo xtask catalog platform-gate --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi

      - name: Go/No-Go unique verdict consistency
        run: |
          grep -q "当前裁决：NO-GO" docs/v1.0.0-go-no-go.md || { echo "go-no-go unique verdict missing NO-GO" >&2; exit 1; }
          echo "GO-NO-GO header PASS"

  g1-fuzz-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Cargo fetch locked
        run: cargo fetch --locked

      - name: seL4 kernel toolchain cache (restore)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.339.0-converge

      - name: Build seL4 kernel + root image (ADR-0023, image dependency)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: Workspace clippy (fail-closed, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace full test suite (fail-closed)
        run: cargo test --workspace --locked

      - name: Cargo deny license/advisory (fail-closed)
        run: |
          cargo install cargo-deny --locked --root /tmp/cargo-deny
          /tmp/cargo-deny/bin/cargo-deny check --manifest-path Cargo.toml

      - name: Image + G1 bound artifacts (fail-closed)
        # 一键生成 raw/iso/recovery/update/sbom/flash/toolchain-report 全部
        # G1 绑定产物（tests/delivery/g1-artifacts.sh，CI 与本地共用入口）；
        # evidence verify 内置（绑定产物缺失即红）。
        run: bash tests/delivery/g1-artifacts.sh

      - name: SM2/SM3/SM4 third-party interop KAT (21-B C1/C2, fail-closed)
        run: |
          set -euo pipefail
          # 向量哈希锚定校验（openssl 生成的第三方向量；禁止篡改/自生成）
          ( cd tests/vectors/sm2-interop && sha256sum -c vectors.json.sha256 --strict )
          # binding（OpenSSL 3）单元 + 互操作 KAT
          cargo test --locked -p eneros-crypto-gmssl
          # 手卷 ↔ openssl 双向互操作 KAT（10 组第三方向量）
          cargo test --locked -p eneros-crypto --test sm2_interop_kat

      - name: attestation tpm2 feature compile+test (29 SE-01, fail-closed)
        # SE-01：真实 TPM2 适配器路径曾引用不存在的 TpmError::KeyUnavailable
        # 导致 --features tpm2 编译失败——本矩阵项使其回归必现。
        run: |
          cargo check --locked -p eneros-attestation --features tpm2
          cargo test --locked -p eneros-attestation --features tpm2

      - name: D1 hot-path unwrap/expect discipline (21-B D1, fail-closed)
        run: bash tests/delivery/no-unwrap-hotpaths.sh

      - name: "Evidence gate (fail-closed, machine-recomputable; 36: gate 非 verify)"
        # 蓝图 36 WP-36.10 #5：release 证据必须 evidence gate（verdict=PASS 才 0），
        # 不能只 verify（存在性检查）。
        run: cargo xtask evidence gate

      - name: "fuzz-smoke-prng: deterministic PRNG smoke (6 parse surfaces, 29 GV-04)"
        # 29 GV-04：PRNG driver 降级为 smoke（固定种子确定性冒烟，无覆盖率
        # 反馈）；真实 libFuzzer harness 由下方 cargo-fuzz job 执行。
        run: |
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader; do
            cargo xtask fuzz $t 10000
          done

      - name: "42 fuzz smoke EvidenceEnvelope report (role-specific semantic gate)"
        run: |
          cargo xtask evidence42 fuzz-report --iterations 10000 --out target/fuzz-smoke-report.json
          cargo xtask evidence42 report-gate --kind fuzz --path target/fuzz-smoke-report.json

      - name: libFuzzer real harness (29 GV-04, 6 targets x 300s, fail-closed)
        # 真 libFuzzer：消费 fuzz/corpus/ 语料，-max_total_time 控制时长。
        # cargo-fuzz 需要 clang（ubuntu-22.04 自带）+ nightly-2026-04-04；
        # bin target 名为 fuzz_<surface>（fuzz/Cargo.toml [[bin]]）。
        run: |
          cargo install cargo-fuzz --locked
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader; do
            cd fuzz
            cargo +nightly-2026-04-04 fuzz run fuzz_$t corpus/$t/ -- -timeout=60 -max_total_time=300
            cd ..
          done

      - name: Perf baseline + candidate regression gate (C-251/42, real measurement)
        run: |
          # 生成真实测量基线（CI 现场生成临时密钥对，不落库），冻结非零 SLO
          # 和容忍度；随后独立 perf-measure 生成候选，禁止候选自建 baseline。
          # WP-26.1：签名链 fail-closed——签名 → 门禁用同一公钥验证；签名缺失
          # 或候选未绑定冻结 baseline → FAIL。
          cargo xtask qa perf-keygen --out /tmp/perf-key.bin --pubkey-out /tmp/perf-pk.hex
          cargo xtask qa perf-baseline --sign-key /tmp/perf-key.bin --slo-threshold 10000000 --tolerance-pct 25 --out target/perf-baseline.json
          cargo xtask qa perf-measure --baseline target/perf-baseline.json --sign-key /tmp/perf-key.bin --out target/perf-candidate.json
          ENEROS_PERF_VERIFY_PUBKEY=$(cat /tmp/perf-pk.hex) \
            cargo xtask qa perf-gate target/perf-candidate.json
          cargo xtask evidence42 report-gate --kind perf --path target/perf-candidate.json

      - name: "26-B WP-26.2 gate: orphan sources (no silent dead files)"
        run: cargo xtask qa gate orphan-check

      - name: "26-B WP-26.2 gate: config references (blocking since 29 GV-01)"
        run: cargo xtask qa gate config-refs

      - name: "26-B WP-26.2 gate: mock leak enforcement (blocking)"
        run: cargo xtask qa gate mock-leak

      - name: VRF-003 gate semantics (no silent pass)
        run: cargo xtask test gate-semantics

      - name: 蓝图/20 R1-1 version-gate-consistency (explicit gate run)
        run: |
          # 版本闸门显式执行：Go/No-Go 非全 PASS → 版本必须带 -rc.N（当前 rc.0 合法）
          cargo xtask qa gng-version

      - name: "D1 soak infrastructure (36 WP-36.10: 无硬件/空执行器 = PENDING 非零)"
        run: |
          # 蓝图 36 WP-36.10 #3：soak 无执行器/无硬件时只允许 PENDING 证据
          # 且非零退出；CI 显式接受 PENDING（当前 NO-GO），禁止任何 PASS 冒充。
          bash tests/soak/soak72.sh || rc=$?
          test -f target/soak/soak-skip-evidence.json || test -f target/soak/soak-campaign.json
          grep -q '"verdict": "PENDING"' target/soak/soak-skip-evidence.json 2>/dev/null \
            || grep -q '"verdict": "FAIL"' target/soak/soak-campaign.json 2>/dev/null \
            || { echo "soak evidence must be PENDING/FAIL, not PASS" >&2; exit 1; }
          # 自检：三个篡改用例必须全部判 FAIL
          bash tests/soak/soak72.sh --self-test
          if grep -nE '(^|[;&|]|[[:space:]])echo [^#]*"PASS' tests/soak/soak72.sh; then
            echo "soak72.sh must not write literal PASS into reports (R1-5)" >&2
            exit 1
          fi

      - name: "G7 claim-consistency audit (36 WP-36.9: 只能 PENDING/REVIEW, 非 PASS)"
        run: |
          # 蓝图 36 WP-36.9 止血：TestPresence/EvidenceFile 只能 PENDING；
          # g7-audit 默认非零，--allow-non-pass 才 exit 0；报告必须 G7-REVIEW。
          cargo xtask qa g7-audit --allow-non-pass
          test -f target/g7-report.json
          grep -q '"verdict": "G7-REVIEW"' target/g7-report.json \
            || { echo "g7 report must not claim PASS (36 止血)" >&2; exit 1; }

      - name: D5 release engineering rehearsal (RC-5, rebuild + OTA plan)
        run: |
          # 换机可复现：CI 环境（nightly + 完整缓存）执行重建脚本；
          # OTA 升级演练：QEMU 可用则实演，否则产出演练预案。
          bash tests/rebuild-ci.sh --skip-tests
          bash tests/ota-rehearsal.sh --skip-qemu
          test -f target/ota-rehearsal/ota-rehearsal-plan.json

      - name: D4 compliance pipeline (RC-4, machine-recomputable evidence)
        run: |
          # 合规报告流水线：信创/等保动态探测 + KAT + QA-017~022 证据
          # 存在性汇总（机器可重算，14 号文 G5）。
          # 34 GV-07（复验）：签名强制——无 --sign-key 即 Err；dev key 入仓
          # 先例（product/security/dev-signing.key）。
          cargo xtask qa compliance-report --sign-key product/security/dev-signing.key
          test -f target/compliance-report.json

      - name: D3b crypto KAT evidence (RC-3b, fail-closed on any KAT failure)
        run: |
          # 密码 KAT 证据包：SM2/SM3/SM4/常数时间全绿 → KAT-ALL-PASS；
          # 任一失败 → 阻断 product_allowed 解除。
          cargo xtask qa kat-report
          test -f target/kat-report.json

      - name: "D2 interop framework (36 WP-36.10: placeholder = PENDING 非零)"
        run: |
          # 蓝图 36 WP-36.10 #1/#2：placeholder 分支只能写 PENDING 并非零；
          # 缺 result JSON（verdict=PASS+peer_identity+oracle）不得推导 VERIFIED。
          bash tests/interop/interop.sh all || rc=$?
          cargo xtask qa interop-report --allow-non-pass
          test -f target/interop/interop-matrix.json
          grep -q '"verdict": "D2-PENDING-REAL-PEERS"' target/interop/interop-matrix.json \
            || grep -q '"verdict": "D2-PASS"' target/interop/interop-matrix.json

      - name: D1 evidence collection (RC-1b, six-category bundle + sha256 manifest)
        run: |
          # 六类证据采集打包 + sha256 清单。
          # 70.14（WP-70.14.1）：缺必需材料 = 非零退出（旧实现无论缺多少都
          # exit 0，与完整包不可区分）；CI 无硬件 → 用显式 `--allow-missing`
          # 产出"缺件报告"（verdict=INCOMPLETE、non_release），并断言这一
          # 语义；严格模式必须失败（证明判据有牙）。
          bash tests/soak/collect-evidence.sh --allow-missing
          test -f target/soak/evidence-bundle/MANIFEST.sha256
          test -f target/soak/evidence-bundle/missing-evidence.txt
          grep -q '"verdict": "INCOMPLETE"' target/soak/evidence-bundle/bundle-verdict.json \
            || { echo "allow-missing bundle must self-declare INCOMPLETE" >&2; exit 1; }
          if bash tests/soak/collect-evidence.sh --bundle-dir target/soak/evidence-strict > /dev/null 2>&1; then
            echo "strict bundle must fail closed when evidence is missing" >&2
            exit 1
          fi
          grep -q '"verdict": "FAIL"' target/soak/evidence-strict/bundle-verdict.json \
            || { echo "strict bundle must self-declare FAIL" >&2; exit 1; }

      - name: "D1 soak run judge (70.14 WP-70.14.1/4: 实测时长/心跳/覆盖/样本)"
        run: |
          # 运行记录判据自证：策略可打印、无记录即非零（不得由参数推算时长）。
          cargo xtask soak policy
          cargo xtask board fact-validate
          if cargo xtask soak run-check target/soak/soak-run.json > /dev/null 2>&1; then
            echo "soak run-check must fail when no run manifest exists" >&2
            exit 1
          fi

  gkernel-qemu-spawn-ipc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Cargo fetch locked
        run: cargo fetch --locked

      - name: seL4 kernel toolchain cache (restore)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.339.0-converge

      - name: Build seL4 kernel + Rust root image (21-A G-KERNEL)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            # 先跑 sel4-build.sh（工具链/sel4-src/libsel4 准备 + 幂等应用
            # third_party/sel4-patches/ 内核补丁），再跑 sel4-build-rust.sh
            # （RUST_ROOT_TASK=ON：初始线程 = eneros-root-task，K3.1 序列
            # 依赖其打印；C root task 产物不满足 G-KERNEL 序列门）。
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build-rust.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: "41: compile signed config bundle (before image build — svc-config embeds it)"
        run: |
          # ACTIVE 配置 → 签名 RuntimeConfigBundle（ota root_key 用测试键注入；
          # release 由 KMS 密钥注入，见 xtask config compile --help）。
          # WP-A.1：控制链信封密钥经 KMS 注入链取得（开发档=仓库 kms-dev
          # 模板；release 由 owner KMS 提供，三者全缺 ⇒ 编译 Err fail-closed）。
          # CI=测试链：签名钥经 --accept-test-signing-key 显式选择测试锚
          # （蓝图 66 WP-66.1.1 fail-closed）。
          ENEROS_KMS_DIR="$GITHUB_WORKSPACE/configs/kms-dev" \
            cargo xtask config compile --profile qemu-prod --accept-test-signing-key \
            --root-key-hex "$(printf '5a%.0s' {1..64})"

      - name: Build qemu-prod image (root-task + services ELF + init bundle)
        run: cargo xtask image qemu-prod

      # 42 WP-42.5：锁定媒体双构建可复现性——同一锁定环境第二次装配必须
      # 与首次字节一致（SOURCE_DATE_EPOCH 全局钉死；ELFs 由 cargo 指纹
      # 缓存复用，本步验证媒体装配层确定性；编译层确定性由 VRF-002
      # build-compare 覆盖）。
      - name: "42 WP-42.5: locked media dual-build reproducibility"
        run: |
          FIRST=$(sha256sum target/eneros/artifacts/qemu-prod/eneros-qemu-prod.raw | cut -d' ' -f1)
          cargo xtask image qemu-prod --output target/media-repro-b.raw
          SECOND=$(sha256sum target/media-repro-b.raw | cut -d' ' -f1)
          if [ "$FIRST" != "$SECOND" ]; then
            echo "MEDIA-REPRO FAIL first=$FIRST second=$SECOND" >&2
            exit 1
          fi
          echo "MEDIA-REPRO PASS bit-identical ($FIRST)"

      # 36 release 门显式接线（security review 收尾）：image 构建产出绑定后
      # normalized manifest，以下 Gate 全部基于它执行；任一红即 CI 失败，
      # 禁止 release 在未授权 crypto / 政策冲突 / bundle 失配下通过。
      - name: 36 release gates (closure / kernel policy / ADR registry / bundle reverse-parse)
        run: |
          cargo xtask closure gate --profile qemu-prod
          cargo xtask policy kernel
          cargo xtask policy adr
          cargo xtask manifest verify-bundle --profile qemu-prod

      - name: Run QEMU full boot chain (21-A G-KERNEL K3.1)
        run: |
          set -euo pipefail
          # 蓝图 36 WP-36.10 #7：QEMU timeout/异常关机 = NO_RESULT/FAIL，
          # 不得再以"日志非空"容忍继续（GV-07 止血）。harness 必须正常结束
          # 且证据齐全才可进入序列门；本机环境缺 SEL4_SRC/KVM 时为
          # BLOCKED_EVIDENCE（记录命令与退出码，不做 PASS）。
          timeout 300 cargo xtask run qemu-prod             --image target/eneros/artifacts/qemu-prod/eneros-qemu-prod.raw             --vars-template target/eneros/artifacts/qemu-prod/AAVMF_VARS.fd             --evidence-dir target/gkernel-evidence             --expect PASS

      - name: "42 role-specific formal-media report gate"
        run: |
          cargo xtask evidence42 report-gate --kind boot --path target/gkernel-evidence/qemu-result.json

      - name: G-KERNEL log sequence gate (K3.3, fail-closed; any line missing = red)
        run: |
          set -euo pipefail
          LOG=target/gkernel-evidence/qemu-serial.log
          test -s "$LOG" || { echo "qemu-serial.log empty or missing" >&2; exit 1; }
          # K3.1 完整序列（启动→spawn→IPC→故障隔离→复验），逐行必现。
          for pat in \
            "[eneros-root-task] Rust root task alive on seL4" \
            "init_bundle @ paddr=" \
            "spawn plan: root=" \
            "[eneros-root-task]   spawn svc-hello entry=" \
            "[eneros-root-task]   spawn svc-fault entry=" \
            "EL0 services spawned" \
            "[eneros-root-task] IPC: send hello-req to svc-hello" \
            "[svc-hello] IPC: recv" \
            "[eneros-root-task] IPC: recv hello:eneros:tick=" \
            "[eneros-root-task] IPC: send fault to svc-fault" \
            "[svc-fault] FAULT" \
            "[eneros-root-task] svc-fault suspended (isolated)" \
            "[eneros-root-task] IPC: svc-hello still responsive" \
          ; do
            grep -Fq "$pat" "$LOG" || { echo "G-KERNEL sequence missing: $pat" >&2; exit 1; }
          done
          echo "G-KERNEL log sequence: 13/13 PASS"

      - name: Persist evidence (K3.2)
        run: |
          mkdir -p product/evidence/kernel
          cp target/gkernel-evidence/qemu-serial.log product/evidence/kernel/gkernel-qemu-boot.log

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: gkernel-qemu-boot.log
          path: product/evidence/kernel/gkernel-qemu-boot.log
