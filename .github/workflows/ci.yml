name: EnerOS formal baseline

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SOURCE_DATE_EPOCH: "1785465257"
  ENEROS_RELEASE_PUBLIC_KEY_HEX: "8e5150375a22ae2ad55ea85a3e7a8faee8196315a413163fd4778c82c59af9a7"
  ENEROS_RELEASE_KEY_ID_HEX: "4e28c578ebd8c3c68b83ff1d0b1a16df"
  ENEROS_PLATFORM_ID_HEX: "6afc39cf058a1ca52a5e36d8eefa1463"

jobs:
  g0-fail-closed:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Fetch locked materials
        run: cargo fetch --locked

      - name: Prove offline locked resolution
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Product profile and forbidden-closure audit
        run: cargo xtask audit all

      - name: Unsafe SAFETY comment coverage (C-243 gate)
        run: cargo xtask audit-unsafe-safety

      - name: BumpAllocator loom concurrency model (C-243 gate)
        run: cargo test --locked -p eneros-services --features loom --lib loom_allocator

      - name: Concurrency loom models (C-247 gate: account/p2p-match/metrics/telemetry-queue)
        run: |
          cargo test --locked -p eneros-account --features loom --lib loom_freeze
          cargo test --locked -p eneros-p2p-match --features loom --lib loom_orderbook
          cargo test --locked -p eneros-metrics --features loom --lib loom_increment
          cargo test --locked -p eneros-telemetry-queue --features loom --lib loom_queue

      - name: Intra-doc link integrity (C-249 gate)
        run: |
          set -euo pipefail
          set +e
          OUT=$(cargo doc --workspace --no-deps 2>&1)
          RC=$?
          set -e
          COUNT=$(echo "$OUT" | awk '/unresolved link/{n++} END{print n+0}')
          if [ "$COUNT" -ne 0 ]; then
            echo "$OUT" | grep -B1 -A4 "unresolved link" | head -80
            echo "FAIL: $COUNT unresolved intra-doc links" >&2
            exit 1
          fi
          echo "rustdoc: 0 unresolved links"

      - name: seL4 kernel toolchain cache (restore)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.192.0

      - name: Build seL4 kernel + root image (ADR-0023, KRN-006)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: QEMU seL4 boot evidence (eneros.sel4.v1, fail-closed)
        run: |
          set -euo pipefail
          if [ ! -f target/sel4/eneros-root-image-arm-qemu-arm-virt ]; then
            echo "target/sel4/eneros-root-image-arm-qemu-arm-virt missing (seL4 build skipped?)" >&2
            exit 1
          fi
          set +e
          timeout 60 qemu-system-aarch64 -machine virt,gic-version=3,secure=off -cpu cortex-a57 \
            -smp 4 -m 1024M -nographic -kernel target/sel4/eneros-root-image-arm-qemu-arm-virt \
            > target/qemu-sel4-boot.log 2>&1
          rc=$?
          set -e
          # 124 = timeout（预期：日志证据已采集完成）；0 = 正常退出；其余视为 QEMU 启动失败。
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "QEMU seL4 boot failed with exit $rc" >&2
            cat target/qemu-sel4-boot.log >&2
            exit 1
          fi
          for t in sel4-kernel-init bootinfo-valid cap-create ipc-loopback root-heartbeat; do
            if ! grep -q "\"test\":\"$t\",\"result\":\"PASS\"" target/qemu-sel4-boot.log; then
              echo "QEMU seL4 evidence missing PASS for $t" >&2
              exit 1
            fi
          done
          echo "QEMU seL4 boot: 5/5 PASS"

      - name: Build every declared profile through the single entry
        run: cargo xtask build all

      - name: Formal xtask unit tests
        run: cargo xtask test unit

      - name: CI policy scan
        run: cargo xtask test ci-policy

      - name: Skip timeout and child-failure mutations
        run: cargo xtask test gate-semantics

      - name: Boot format and loader tests
        run: cargo test --locked -p eneros-boot-protocol -p eneros-image-format -p eneros-boot-manager-uefi

      - name: Verify frozen Cargo graph and binary BOM
        shell: pwsh
        # -ExternalBinary：sel4 elfloader 为 C 构建产物（非 cargo workspace
        # 二进制），闭包为空；binary-boms.json 须含其条目（release sbom 依赖）。
        run: tools/delivery/cargo-closure.ps1 -VerifyDirectory product/closure -Repository . -ExternalBinary sel4:elfloader-arm-qemu-arm-virt

      - name: Forbidden package mutation must fail
        shell: bash
        run: |
          if cargo xtask audit profile qemu-prod --fault-inject-package mockall; then
            echo "forbidden package mutation was accepted" >&2
            exit 1
          fi

      - name: Legacy entrypoints must fail
        shell: bash
        run: |
          if make; then
            echo "legacy Makefile was accepted" >&2
            exit 1
          fi
          if tools/flash.sh --help; then
            echo "legacy flash script was accepted" >&2
            exit 1
          fi

      - name: VRF-002 dual-build byte comparison (bit-identical payload)
        run: cargo xtask build-compare

  g1-fuzz-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Cargo fetch locked
        run: cargo fetch --locked

      - name: seL4 kernel toolchain cache (restore)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.192.0

      - name: Build seL4 kernel + root image (ADR-0023, image dependency)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: Workspace clippy (fail-closed, -D warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace full test suite (fail-closed)
        run: cargo test --workspace --locked

      - name: Cargo deny license/advisory (fail-closed)
        run: |
          cargo install cargo-deny --locked --root /tmp/cargo-deny
          /tmp/cargo-deny/bin/cargo-deny check --manifest-path Cargo.toml

      - name: Image + G1 bound artifacts (fail-closed)
        # 一键生成 raw/iso/recovery/update/sbom/flash/toolchain-report 全部
        # G1 绑定产物（tests/delivery/g1-artifacts.sh，CI 与本地共用入口）；
        # evidence verify 内置（绑定产物缺失即红）。
        run: bash tests/delivery/g1-artifacts.sh

      - name: SM2/SM3/SM4 third-party interop KAT (21-B C1/C2, fail-closed)
        run: |
          set -euo pipefail
          # 向量哈希锚定校验（openssl 生成的第三方向量；禁止篡改/自生成）
          ( cd tests/vectors/sm2-interop && sha256sum -c vectors.json.sha256 --strict )
          # binding（OpenSSL 3）单元 + 互操作 KAT
          cargo test --locked -p eneros-crypto-gmssl
          # 手卷 ↔ openssl 双向互操作 KAT（10 组第三方向量）
          cargo test --locked -p eneros-crypto --test sm2_interop_kat

      - name: D1 hot-path unwrap/expect discipline (21-B D1, fail-closed)
        run: bash tests/delivery/no-unwrap-hotpaths.sh

      - name: Evidence gate (fail-closed, machine-recomputable)
        run: cargo xtask evidence verify

      - name: fuzz-smoke-prng: deterministic PRNG smoke (6 parse surfaces, 29 GV-04)
        # 29 GV-04：PRNG driver 降级为 smoke（固定种子确定性冒烟，无覆盖率
        # 反馈）；真实 libFuzzer harness 由下方 cargo-fuzz job 执行。
        run: |
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader; do
            cargo xtask fuzz $t 10000
          done

      - name: libFuzzer real harness (29 GV-04, 6 targets x 300s, fail-closed)
        # 真 libFuzzer：消费 fuzz/corpus/ 语料，-max_total_time 控制时长。
        # cargo-fuzz 需要 clang（ubuntu-22.04 自带）+ nightly-2026-04-04；
        # bin target 名为 fuzz_<surface>（fuzz/Cargo.toml [[bin]]）。
        run: |
          cargo install cargo-fuzz --locked
          for t in boot_protocol ipc_wire modbus_rtu iec104 elf_loader gguf_loader; do
            cd fuzz
            cargo +nightly-2026-04-04 fuzz run fuzz_$t corpus/$t/ -- -timeout=60 -max_total_time=300
            cd ..
          done

      - name: Perf baseline + regression gate (C-251, real measurement)
        run: |
          # 生成真实测量基线（unsigned——CI 无签名密钥；篡改保护由
          # 发布流程 --sign-key 提供，见 xtask qa perf-baseline --help 文档）。
          # WP-26.1：签名链 fail-closed——CI 现场生成临时密钥对（不落库），
          # 签名 → 门禁用同一公钥验证；签名缺失 → FAIL（不再 rm -f 绕过）。
          cargo xtask qa perf-keygen --out /tmp/perf-key.bin --pubkey-out /tmp/perf-pk.hex
          cargo xtask qa perf-baseline --sign-key /tmp/perf-key.bin
          ENEROS_PERF_VERIFY_PUBKEY=$(cat /tmp/perf-pk.hex) \
            cargo xtask qa perf-gate target/perf-results.json

      - name: 26-B WP-26.2 gate: orphan sources (no silent dead files)
        run: cargo xtask qa gate orphan-check

      - name: 26-B WP-26.2 gate: config references (warn-only, stage 0)
        run: cargo xtask qa gate config-refs

      - name: 26-B WP-26.2 gate: mock leak enforcement (blocking)
        run: cargo xtask qa gate mock-leak

      - name: VRF-003 gate semantics (no silent pass)
        run: cargo xtask test gate-semantics

      - name: 蓝图/20 R1-1 version-gate-consistency (explicit gate run)
        run: |
          # 版本闸门显式执行：Go/No-Go 非全 PASS → 版本必须带 -rc.N（当前 rc.0 合法）
          cargo xtask qa gng-version

      - name: D1 soak infrastructure (RC-1a, skip-evidence on no hardware)
        run: |
          # 真机浸泡执行器：无硬件 → 跳过证据+就绪清单（exit 0）；
          # 硬件就绪 → 全量浸泡矩阵 + QA-018 证据。
          bash tests/soak/soak72.sh
          test -f target/soak/soak-skip-evidence.json             || test -f target/soak/soak-campaign.json
          # 蓝图/20 R1-5：禁止字面量 "PASS" 直接写入报告的分支（grep 门禁）
          # 自检：三个篡改用例必须全部判 FAIL
          bash tests/soak/soak72.sh --self-test
          if grep -nE '(^|[;&|]|[[:space:]])echo [^#]*"PASS' tests/soak/soak72.sh; then
            echo "soak72.sh must not write literal PASS into reports (R1-5)" >&2
            exit 1
          fi

      - name: G7 claim-consistency audit (v1.0.0 gate, no mock claimed as real)
        run: |
          cargo xtask qa g7-audit
          test -f target/g7-report.json

      - name: D5 release engineering rehearsal (RC-5, rebuild + OTA plan)
        run: |
          # 换机可复现：CI 环境（nightly + 完整缓存）执行重建脚本；
          # OTA 升级演练：QEMU 可用则实演，否则产出演练预案。
          bash tests/rebuild-ci.sh --skip-tests
          bash tests/ota-rehearsal.sh --skip-qemu
          test -f target/ota-rehearsal/ota-rehearsal-plan.json

      - name: D4 compliance pipeline (RC-4, machine-recomputable evidence)
        run: |
          # 合规报告流水线：信创/等保动态探测 + KAT + QA-017~022 证据
          # 存在性汇总（机器可重算，14 号文 G5）。
          cargo xtask qa compliance-report
          test -f target/compliance-report.json

      - name: D3b crypto KAT evidence (RC-3b, fail-closed on any KAT failure)
        run: |
          # 密码 KAT 证据包：SM2/SM3/SM4/常数时间全绿 → KAT-ALL-PASS；
          # 任一失败 → 阻断 product_allowed 解除。
          cargo xtask qa kat-report
          test -f target/kat-report.json

      - name: D2 interop framework (RC-2, matrix report on real-peer availability)
        run: |
          # 四类对端互操作 harness：无真实对端 → skip 证据+矩阵报告
          # （D2-PENDING-REAL-PEERS）；对端地址注入 → 全用例执行。
          bash tests/interop/interop.sh all
          cargo xtask qa interop-report
          test -f target/interop/interop-matrix.json

      - name: D1 evidence collection (RC-1b, six-category bundle + sha256 manifest)
        run: |
          # 六类证据采集打包：无硬件时产出缺失清单（fail-open 报告），
          # 有硬件时产出完整证据包。manifest 哈希供防篡改校验。
          bash tests/soak/collect-evidence.sh
          test -f target/soak/evidence-bundle/MANIFEST.sha256
          test -f target/soak/evidence-bundle/missing-evidence.txt

  gkernel-qemu-spawn-ipc:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly-2026-04-04
        with:
          components: rust-src, clippy, rustfmt
          targets: aarch64-unknown-none,aarch64-unknown-uefi

      - name: Cargo fetch locked
        run: cargo fetch --locked

      - name: seL4 kernel toolchain cache (restore)
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/sel4
            target/sel4
          key: sel4-${{ runner.os }}-v0.192.0

      - name: Build seL4 kernel + Rust root image (21-A G-KERNEL)
        run: |
          if [ ! -f target/sel4/elfloader-arm-qemu-arm-virt ]; then
            # 先跑 sel4-build.sh（工具链/sel4-src/libsel4 准备 + 幂等应用
            # third_party/sel4-patches/ 内核补丁），再跑 sel4-build-rust.sh
            # （RUST_ROOT_TASK=ON：初始线程 = eneros-root-task，K3.1 序列
            # 依赖其打印；C root task 产物不满足 G-KERNEL 序列门）。
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build.sh
            SEL4_CACHE="${{ runner.tool_cache }}/sel4" third_party/sel4-build-rust.sh
          else
            echo "target/sel4 already present, skipping seL4 rebuild"
          fi

      - name: Build qemu-prod image (root-task + services ELF + init bundle)
        run: cargo xtask image qemu-prod

      - name: Run QEMU full boot chain (21-A G-KERNEL K3.1)
        run: |
          set -euo pipefail
          # G-KERNEL 场景：root-task 常驻运行（seL4 无 ACPI 关机，QEMU 以
          # harness 内部 200s 超时结束为预期）；harness 在超时分支先落盘
          # qemu-serial.log 再报错，随后 K3.3 序列门做 fail-closed 判定。
          # 此处容忍"QEMU 未正常关机"，但日志缺失（含未生成镜像/早退）仍红。
          # --expect PASS 依赖 G1 QA-003 的 boot-evidence + 正常关机（遗留，
          # 非 G-KERNEL 范围）；run 失败但日志存在即继续到序列门。
          timeout 300 cargo xtask run qemu-prod             --image target/eneros/artifacts/qemu-prod/eneros-qemu-prod.raw             --vars-template target/eneros/artifacts/qemu-prod/AAVMF_VARS.fd             --evidence-dir target/gkernel-evidence             --expect PASS 2>&1 || test -s target/gkernel-evidence/qemu-serial.log

      - name: G-KERNEL log sequence gate (K3.3, fail-closed; any line missing = red)
        run: |
          set -euo pipefail
          LOG=target/gkernel-evidence/qemu-serial.log
          test -s "$LOG" || { echo "qemu-serial.log empty or missing" >&2; exit 1; }
          # K3.1 完整序列（启动→spawn→IPC→故障隔离→复验），逐行必现。
          for pat in \
            "[eneros-root-task] Rust root task alive on seL4" \
            "init_bundle @ paddr=" \
            "spawn plan: root=" \
            "[eneros-root-task]   spawn svc-hello entry=" \
            "[eneros-root-task]   spawn svc-fault entry=" \
            "EL0 services spawned" \
            "[eneros-root-task] IPC: send hello-req to svc-hello" \
            "[svc-hello] IPC: recv" \
            "[eneros-root-task] IPC: recv hello:eneros:tick=" \
            "[eneros-root-task] IPC: send fault to svc-fault" \
            "[svc-fault] FAULT" \
            "[eneros-root-task] svc-fault suspended (isolated)" \
            "[eneros-root-task] IPC: svc-hello still responsive" \
          ; do
            grep -Fq "$pat" "$LOG" || { echo "G-KERNEL sequence missing: $pat" >&2; exit 1; }
          done
          echo "G-KERNEL log sequence: 13/13 PASS"

      - name: Persist evidence (K3.2)
        run: |
          mkdir -p product/evidence/kernel
          cp target/gkernel-evidence/qemu-serial.log product/evidence/kernel/gkernel-qemu-boot.log

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: gkernel-qemu-boot.log
          path: product/evidence/kernel/gkernel-qemu-boot.log
