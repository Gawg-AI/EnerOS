[package]
name = "eneros-fuzz"
version = "0.250.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eneros-boot-protocol = { path = "../crates/boot/boot-protocol" }
eneros-ipc-wire = { path = "../crates/abi/ipc-wire" }
eneros-modbus-rtu = { path = "../crates/protocols/modbus-rtu" }
# SPEC-D C2：成帧层半帧垃圾输入靶（MockUartHw，host-only；release 闭包无此边）。
eneros-rs485 = { path = "../crates/drivers/rs485", features = ["mock"] }
eneros-driver-framework = { path = "../crates/drivers/framework" }
eneros-iec104-slave = { path = "../crates/protocols/iec104-slave" }
eneros-elf-loader = { path = "../crates/abi/elf-loader" }
eneros-gguf-loader = { path = "../crates/ai/gguf-loader" }
eneros-config-bundle = { path = "../crates/runtime/config-bundle" }
eneros-mqtt = { path = "../crates/protocols/mqtt" }

[[bin]]
name = "fuzz_boot_protocol"
path = "fuzz_targets/boot_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ipc_wire"
path = "fuzz_targets/ipc_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_modbus_rtu"
path = "fuzz_targets/modbus_rtu.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_iec104"
path = "fuzz_targets/iec104.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_elf_loader"
path = "fuzz_targets/elf_loader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_gguf_loader"
path = "fuzz_targets/gguf_loader.rs"
test = false
doc = false
bench = false

# SPEC-GAP-CLOSURE-2026-08-26 / F-2（GAP-FUZZ 三件套）
[[bin]]
name = "fuzz_points"
path = "fuzz_targets/points.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_toml_compile"
path = "fuzz_targets/toml_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_mqtt_packet"
path = "fuzz_targets/mqtt_packet.rs"
test = false
doc = false
bench = false

# v0.250.0（C-250）：独立于主 workspace——cargo-fuzz 要求 fuzz crate
# 独立解析（libFuzzer 的 nightly/clang 构建链与主 workspace 的 stable
# 门禁互不干扰）。
[workspace]
