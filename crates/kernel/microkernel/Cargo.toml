[package]
name = "eneros-microkernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS microkernel 多核内存一致性 自旋锁/屏障 + v0.138.0 调度确定性与 WCET 验证（WCET 测量/抖动统计/JitterStats/WcetProfiler） + v0.139.0 同步消息传递 IPC（Endpoint/Message/IpcManager/send/recv/call/reply） + v0.140.0 通知机制与异步信号（Notification/NotificationManager/signal/wait/bind_irq） + v0.141.0 共享内存 IPC（ShmManager/连续帧/能力控制映射/缓存同步） + v0.142.0 能力管理器 Capability-based（Capability/CapSpace/CapabilityManager/mint/check/revoke/派生链/时间窗约束） + v0.143.0 HAL 接口与 ARM64 实现（Hal trait/HalRegistry/GenericTimer/Pl011 封装/GPIO 占位/Aarch64Hal） + v0.144.0 x86_64 BSP 占位（X86Hal/LocalApic/Uart8250/X86PageTable——ADR-0001 降级口径接口占位） + v0.145.0 飞腾 D2000 BSP（PhytiumHal 组合 Aarch64Hal + PhytiumSmmu + PhytiumCrypto + boot::dtb_find_node——★ 信创核心交付，真机路径保留 + host 可测骨架） + v0.146.0 鲲鹏 920 BSP（KunpengHal 组合 Aarch64Hal + KunpengSmmu + KunpengNuma + boot::dtb_count_nodes——★ 信创核心 双国产平台，cfg-gated 真机路径 + host 可测骨架） + v0.147.0 RISC-V + 龙芯 BSP 接口占位（RiscvHal standalone + Plic + Clint + UartSifive + LoongArchHal standalone + LoongsonPch 复用 x86_64::Uart8250——P3-E 终版本 ADR-0001 BSP 收敛降级口径接口占位，无 cfg 门控真机路径 + 无真机验证） + v0.148.0 形式化规范框架（formal/ 目录 + Isabelle/HOL + Kernel.thy 抽象规范 + Refinement.thy 精化映射 + ROOT session + Makefile 证明检查入口 + 三层映射架构——P3-F 首版本 ADR-0001 裁剪 4 证明→2 证明，IPC/能力复用 seL4 已有证明，sorry 占位延后至 v0.150.0/v0.151.0/v0.153.0） + v0.149.0 调度器规范抽象（Scheduler.thy 优先级抢占调度 sched_step/inv_priority/liv_fair + step_preserves_priority sorry 占位延后 v0.150.0——P3-F 第 2 版本 ADR-0001 保留项） + v0.150.0 调度器形式化证明 ★（Scheduler_Proof.thy scheduler_safety 完整归纳证明 rtranclp.induct + sched_step.induct 无 sorry + scheduler_liveness sorry 占位需公平性假设 + ready_schedulable 辅助引理 + tests/scheduler_proof_test.rs F1~F5 host 可测骨架 + docs/formal/scheduler_proof.md 11 章证明设计文档——P3-F 第 3 版本 第一个形式化证明里程碑 ADR-0001 保留项 #1 调度器证明） + v0.151.0 内存隔离规范抽象（Memory.thy inv_isolation 跨分区不相交不变式 + map_page 映射操作 + map_preserves_isolation sorry 占位延后 v0.152.0 + tests/memory_spec_test.rs F1~F5 host 可测骨架 + docs/formal/memory_spec.md 11 章规范设计文档——P3-F 第 4 版本 ADR-0001 保留项 #2 内存隔离证明） + v0.152.0 内存隔离形式化证明 ★（Memory_Proof.thy isolation_safety rtranclp 完整归纳证明 rtranclp.induct 外层 + map_page.induct 内层双层归纳无 sorry ★ 里程碑 + D2a map_page\\<^sup>*\\<^sup>* 记法修正 + D2b case (map v s target) + D2c IH 直接引用 + D2d/D2e add_region_def + tests/memory_proof_test.rs F1~F5 host 可测骨架 ★ 无 sorry 验收 + docs/formal/memory_proof.md 11 章证明设计文档——P3-F 第 5 版本 第二个形式化证明里程碑 ADR-0001 保留项 #2 内存隔离证明，D3 Memory.thy sorry 保留 Surgical Changes） + v0.153.0 IPC 规范抽象（Ipc.thy inv_integrity 完整性不变式 delivered ⊆ sent + inv_no_forge 不可伪造不变式 badge ∈ valid_senders + ipc_send/ipc_recv 操作 + D2 valid_senders 常量 + D3 recv badge 校验前提 + docs/formal/ipc_spec.md——P3-F 第 6 版本 ADR-0001 IPC 证明降级为 seL4 引用） + v0.154.0 IPC 形式化证明 ★（Ipc_Proof.thy ipc_integrity_all rtranclp 完整归纳证明 rtranclp.induct + ipc_step.induct 双层归纳无 sorry ★ 第三个形式化证明里程碑 + ipc_no_forge 不可伪造证明 + D2 ipc_step 组合谓词 + D3 erule ipc_recv.cases + tests/ipc_proof_test.rs F1~F5 host 可测骨架 + docs/formal/ipc_proof.md——P3-F 第 7 版本） + v0.156.0 用户态兼容性验证（compat/ 模块目录 + types.rs MessageInfo/CPtr/Rights/CompatError + translation.rs SyscallTranslator 20 条翻译表 + cspace.rs CSpaceMapper 定长 256 映射 + shim.rs Sel4Compat/Sel4Shim/KernelSyscallOps 注入式 + CompatStats 可观测计数 + feature sel4-compat——P3-G 首版本 ADR-0001 方案 A seL4 深度定制后用户态兼容性验证） (no_std, v0.156.0)"

[dependencies]
eneros-bootloader = { path = "../bootloader" }

[features]
default = []
sel4-compat = []

[[bin]]
name = "kernel"
path = "src/main.rs"
