[package]
name = "eneros-solver-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS LP/MILP solver integration (HiGHS via FFI + MockSolver for tests, no_std)"

[dependencies]

[features]
# v0.212.0（P0-27）：移除 default=["mock"]——release 必须显式选真实后端。
# Dev/test 构建自动有 `test` cfg（mock 模块可用）；生产构建必须
# `--no-default-features --features highs-ffi`。
default = ["highs-ffi"]
# Real HiGHS backend (statically linked C library).
# Release builds MUST enable this feature — Mock is test-only.
highs-ffi = []
# Mock backend (test/dev only). Release builds must NOT use this.
# When enabled, MockSolver is available. When disabled, MockSolver is hidden.
mock = []

# Fail-closed: if no backend is selected in a non-test build, the crate
# emits a compile_error. This prevents accidental Mock-only release builds.
# Tests automatically get `test` cfg, which bypasses this gate.
