[package]
name = "eneros-dual-brain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.71.0 Dual-brain coordinator (LLM + Solver end-to-end, <2s, no_std)"

[dependencies]
# v0.248.0（C-248）：遥测真实性——latency 各字段接真实单调时钟
# （eneros-time::get_monotonic_ns；boot 后可用，未初始化回退 0）。
eneros-time = { path = "../../drivers/time" }
# 22 §2.W5.1：AI 决策入审计链（SM3 哈希链可追溯/篡改检出）。
eneros-audit = { path = "../../security/audit" }
# 32 AG-04：审计创世锚从会话密钥材料 SM3 派生（decision_audit_from_key）。
eneros-crypto = { path = "../../security/crypto" }
# 22 §2.W2.2：AI→设备经 ControlChain（锁定 5）。
eneros-control-gateway = { path = "../../protocols/control-gateway" }
eneros-telemetry-model = { path = "../../protocols/telemetry-model" }
eneros-solver-core = { path = "../solver-core", default-features = false }
eneros-energy-lp-model = { path = "../energy-lp-model" }
eneros-safety-validator = { path = "../safety-validator" }
eneros-intent-parser = { path = "../intent-parser", optional = true }
eneros-intent-contract = { path = "../intent-contract" }
eneros-fast-path = { path = "../fast-path", optional = true }
# 蓝图 40 WP-40.4：llama-cpp 为 host native 后端——target 闭包经
# `llm-native` feature 选择；默认不启用（profile 不声明 → 服务 Unavailable）。
eneros-llm-engine = { path = "../llm-engine", optional = true }
eneros-infer-scheduler = { path = "../infer-scheduler", optional = true }
eneros-prompt-template = { path = "../prompt-template", optional = true }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = []
# v0.212.0（P0-27）：mock 仅测试/显式启用；生产不依赖 mock。
# 49（WP-49.4 死重治理）：coordinator 门控——7 步编排器及其重依赖
# （intent-parser/fast-path/infer-scheduler/prompt-template/llm-engine）
# 仅 host 消费方启用；target 子集（decision/gate/audit）零死重。
coordinator = [
    "dep:eneros-intent-parser",
    "dep:eneros-fast-path",
    "dep:eneros-infer-scheduler",
    "dep:eneros-prompt-template",
    "dep:eneros-llm-engine",
]
mock = ["coordinator", "eneros-solver-core/mock"]
# 蓝图 40 WP-40.4：host LLM 后端（llama.cpp native）——target 不声明。
llm-native = ["coordinator", "eneros-llm-engine/llama-cpp", "eneros-infer-scheduler/llm-native"]

[dev-dependencies]
# v0.244.0：lib 测试使用 MockSolver（solver-core 的 mock 模块在 test 构建
# 下需要显式启用该 feature；dev-dependencies 在 cargo test 时自动生效）。
eneros-solver-core = { path = "../solver-core", features = ["mock"] }

eneros-llm-engine = { path = "../llm-engine", features = ["mock"] }
