[package]
name = "eneros-dual-brain"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.71.0 Dual-brain coordinator (LLM + Solver end-to-end, <2s, no_std)"

[dependencies]
# v0.248.0（C-248）：遥测真实性——latency 各字段接真实单调时钟
# （eneros-time::get_monotonic_ns；boot 后可用，未初始化回退 0）。
eneros-time = { path = "../../drivers/time" }
eneros-solver-core = { path = "../solver-core" }
eneros-energy-lp-model = { path = "../energy-lp-model" }
eneros-safety-validator = { path = "../safety-validator" }
eneros-intent-parser = { path = "../intent-parser" }
eneros-intent-contract = { path = "../intent-contract" }
eneros-fast-path = { path = "../fast-path" }
eneros-llm-engine = { path = "../llm-engine" }
eneros-prompt-template = { path = "../prompt-template" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = []
# v0.212.0（P0-27）：mock 仅测试/显式启用；生产不依赖 mock。
mock = ["eneros-solver-core/mock"]

[dev-dependencies]
# v0.244.0：lib 测试使用 MockSolver（solver-core 的 mock 模块在 test 构建
# 下需要显式启用该 feature；dev-dependencies 在 cargo test 时自动生效）。
eneros-solver-core = { path = "../solver-core", features = ["mock"] }
