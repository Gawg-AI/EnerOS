[package]
name = "eneros-installer-uefi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false
description = "Fail-closed EnerOS UEFI installer for signed formal disk images"
build = "build.rs"

# WP-74.3.1：host 可测 lib（manifest 验签唯一入口 + 失败码词表；UEFI
# 无关）——bin 经 lib 复用，CI 测试清单 -p eneros-installer-uefi 只编
# lib+tests（bin required-features 门控跳过）。
[lib]
name = "eneros_installer_uefi"
path = "src/lib.rs"

[[bin]]
name = "installer-uefi"
path = "src/main.rs"
required-features = ["uefi-app"]
test = false
bench = false

[dependencies]
eneros-boot-protocol = { path = "../boot-protocol", default-features = false }
# 39 WP-39.4（P1-07）：安装目标全域安全判定。
eneros-image-format = { path = "../image-format" }
sha2 = { version = "0.10.9", default-features = false }
uefi = { version = "0.39.0", optional = true, features = ["alloc", "global_allocator", "panic_handler"] }

# WP-74.3.1：installer 生产面不再自带任何密码学路径（验签唯一入口 =
# boot-protocol 的 Ed25519SignatureProvider）；ed25519-dalek 降为
# 测试侧现签依赖——bin/lib 均不再直接依赖（直验结构性不可表示）。
[dev-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "fast", "zeroize"] }

[features]
default = []
uefi-app = ["dep:uefi"]
