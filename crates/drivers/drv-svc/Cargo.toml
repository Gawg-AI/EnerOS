[package]
name = "eneros-drv-svc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS driver/storage EL0 services — rng/blk/net/console/storage/fault (no_std, aarch64-unknown-none)"

[lib]
name = "eneros_drv_svc"
path = "src/lib.rs"

[dependencies]
# 38（WP-38.9）：驱动服务通用 IPC runtime——真实 IPC loop（envelope/
# bounded queue/deadline/epoch），不再 spin_loop 占位。
eneros-ipc-wire = { path = "../../abi/ipc-wire" }
# SPEC-B/C（2026-08-28）：移交 vaddr 常量单源（blk_backend re-use）。
eneros-handover-abi = { path = "../../abi/handover-abi" }
eneros-runtime = { path = "../../runtime/runtime" }
eneros-sel4-sys = { path = "../../runtime/sel4-sys" }
eneros-hal = { path = "../../hal/hal" }
# 41（WP-41.1 存储句柄移交）：svc-storage 真块服务——VirtioBlkDriver
# 作为 BlockBackend（no_std，host 测试用 mock）。
# 50 二分实验：恢复 diag（启动冻结定位——依赖图变化即 ELF 布局变化，
# 疑暴露 virtio 时序敏感路径）。定位后另行处置。
# E 续作复验（2026-08-28 窗口实测）：曾试探摘除本 feature 以减免 31×
# UART 税——摘除态与保留态**各复现一次** fleet init 中途串口冻结
# （BP-50"环境性启动冻结"=间歇性 virtio 时序竞态，与 diag 无必然因果）。
# diag 维持保留（摘除无收益、徒增变量）；31× 税 + 间歇冻结的根治
# （virtio 等待语义/驱动时序）归调度·驱动层卷。
eneros-storage = { path = "../../drivers/storage", features = ["diag"] }
linked_list_allocator = "0.10"

[[bin]]
name = "svc-drv-rng"
path = "src/bin/svc-drv-rng.rs"

[[bin]]
name = "svc-drv-blk"
path = "src/bin/svc-drv-blk.rs"

[[bin]]
name = "svc-drv-net"
path = "src/bin/svc-drv-net.rs"

[[bin]]
name = "svc-drv-console"
path = "src/bin/svc-drv-console.rs"

[[bin]]
name = "svc-storage"
path = "src/bin/svc-storage.rs"

[[bin]]
name = "svc-drv-fault"
path = "src/bin/svc-drv-fault.rs"

[features]
# 蓝图 40：控制服务大堆（256 KiB——ingress/chain 装配）；默认 64 KiB。
heap-large = []
default = []
