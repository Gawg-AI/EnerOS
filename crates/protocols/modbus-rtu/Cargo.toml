[package]
name = "eneros-modbus-rtu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS Modbus RTU master protocol stack"

[features]
mock = []

[dependencies]
eneros-driver-framework = { path = "../../drivers/framework" }
eneros-protocol-abstract = { path = "../protocol-abstract" }
eneros-upa-model = { path = "../upa-model" }
# 36 WP-36.6：rs485 是生产 transport 依赖，但不得携带 mock feature
# （release resolved graph 零 mock）；mock 仅测试构建可见（dev-dependencies）。
eneros-rs485 = { path = "../../drivers/rs485" }

[dev-dependencies]
# 集成测试：真实单调时钟（eneros-time boot 前恒 0）。
eneros-hal = { path = "../../../crates/hal/hal" }
eneros-protocol-abstract = { path = "../protocol-abstract", features = ["mock"] }
# 集成测试：MockUartHw（tests/loopback.rs）——仅测试构建启用 mock。
eneros-rs485 = { path = "../../drivers/rs485", features = ["mock"] }
# SPEC-D WP-D.2 C1 全链：SerialTransportFactory → plugin 装配路径
# （tests/serial_plugin_chain.rs）。仅 dev 边——release 闭包不进入。
eneros-protocol-services = { path = "../protocol-services" }
# C1 回执分类断言（OutcomeFrame/OutcomeCode 与 dispatch 同源语义）。
eneros-control-gateway = { path = "../control-gateway" }
