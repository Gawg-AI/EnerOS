[package]
name = "eneros-agent-bus-dds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.78.0 DDS middleware + Agent Bus router (34 SE-11: 签名层退役——传输层已有等价保护; Cyclone DDS via FFI + MockDdsNode, no_std)"

[dependencies]
slotmap = { version = "1.0", default-features = false }

[features]
# 测试专用 mock（显式启用；release 不得启用——mock 纪律）。
mock = []
default = []

[package.metadata.eneros]
# 21-B B2（ADR-021 预设裁决）：v1.0.0 agent 总线改用 MQTT（真实可用），
# DDS 接 C 库工程量高且 CycloneDdsNode 当前返回 Ffi(-1)——agent-bus-dds
# 标注 out-of-v1.0，不进入 v1.0.0 发布闭包。
commercial_scope = "out-of-v1.0"
agent_bus_role = "replaced-by-mqtt"
