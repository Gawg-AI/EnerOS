[package]
name = "eneros-mqtt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS MQTT v3.1.1 客户端 — QoS 0/1/2 + 遗嘱 + 断线重连 + 订阅恢复"

[dependencies]
eneros-hex = { path = "../../abi/hex" }
eneros-time = { path = "../../drivers/time" }
eneros-upa-model = { path = "../upa-model" }
# 39 WP-39.12：eneros-fs 仅 FsQosStore 使用（QoS 持久化）——改为可选
# feature（默认开；target 无持久化需求/避免 littlefs2-sys bindgen 时关闭）。
eneros-fs = { path = "../../drivers/fs", optional = true }
# 39 WP-39.9：安全通道接缝（SecureChannel/SecureChannelFactory）。
eneros-protocol-abstract = { path = "../protocol-abstract" }
# 蓝图 64 WP-64.1.2：协议配置键表单源（零依赖叶 crate；KNOWN_KEYS 只引用不复制）。
eneros-protocol-keys = { path = "../protocol-keys" }
# v0.221.0（B2-04）：真实 TCP 传输（smoltcp，经真实 DMA 环）。
eneros-net = { path = "../../drivers/net", optional = true }

[features]
default = ["fs-persist"]
mock = []
# 真实传输层（默认关闭保持无外部依赖；启用后提供 NetTcpTransport）。
net = ["dep:eneros-net"]
# QoS 落盘持久化（FsQosStore；依赖 eneros-fs）。
fs-persist = ["dep:eneros-fs"]
# tls 空壳 feature 已删（SPEC-SERIES-2026-08-27/F WP-F.4）：零实现零 cfg 引用，
# 防误导「开 feature 即有 TLS」；真实传输层选型走 OQ-1（EXT-01 密码评审）。

[dev-dependencies]
# 39：插件测试用 test_support（EchoTransport）。
eneros-protocol-abstract = { path = "../protocol-abstract", features = ["mock"] }
