[package]
name = "eneros-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS 国密算法库 (SM2/SM3/SM4 + CSRNG) — pure Rust, no_std, no C FFI"
publish = false

[package.metadata.eneros]
# ADR-022（2026-08-09）裁决：双实现架构——std 面由 eneros-crypto-gmssl
# （OpenSSL 3 binding，vetted）承担；本 crate 为 no_std 目标（seL4 EL0）
# 唯一可链接实现，保持 product_allowed=false（fail-closed）。手卷正确性
# 由 crypto-gmssl 互操作 KAT 交叉验证（tests/vectors/sm2-interop，
# openssl 第三方向量）；target 端送审（商密认证）为解锁前置。
product_allowed = false
isolation_reason = "ADR-022: no_std target hand-rolled SM2/SM3/SM4 verified against OpenSSL-3 interop KAT; awaiting commercial crypto review (Phase D) before product inclusion"

[dependencies]
# No external dependencies — pure Rust implementation
# ECDSA P-256 验签（蓝图/20 R1-3：设备端 TLS 证书链验证扩展）；
# no_std 默认，禁用默认 feature（不引入 rand/std）。
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
# 测试专用（ECDSA 测试签名需要 rng）
rand_core = { version = "0.6", features = ["std"] }
# 互操作 KAT（21-B C2）：DER 签名编解码（eneros-crypto-gmssl::der）。
eneros-crypto-gmssl = { path = "../crypto-gmssl" }
serde_json = "1"
hex = "0.4"

[features]
qemu-entropy = []
default = []
# Feature flag for std-only tests (optional)
std = []
# Explicit research escape hatch. Product policy rejects this feature and the
# entire package in every release profile.
insecure-test-rng = []
