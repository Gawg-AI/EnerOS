[package]
name = "eneros-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS reference EL0 services — svc-hello/svc-pi/svc-hog/svc-fault (no_std, aarch64-unknown-none)"

[lib]
name = "eneros_services"
path = "src/lib.rs"

[[bin]]
name = "svc-hello"
path = "src/bin/svc-hello.rs"

[[bin]]
name = "svc-pi"
path = "src/bin/svc-pi.rs"

[[bin]]
name = "svc-hog"
path = "src/bin/svc-hog.rs"

[[bin]]
name = "svc-fault"
path = "src/bin/svc-fault.rs"

[dependencies]
eneros-ipc-wire = { path = "../../abi/ipc-wire" }
eneros-runtime = { path = "../runtime" }
eneros-sel4-sys = { path = "../sel4-sys" }
# 22 §2.W1.2：服务 panic 审计（SM3 哈希链，无堆定容）。
eneros-audit = { path = "../../security/audit" }
# 36 WP-36.2/SC-03 曾为创世根引入 sha2；蓝图 54 WP-54.1 派生收编至
# eneros_audit::genesis，本 crate 不再直接依赖。
heapless = "0.8"
spin = "0.9"
# v0.243.0（C-243）：BumpAllocator 并发模型验证（loom；feature 门控，
# 仅在 cfg(all(test, feature="loom")) 下编译使用）。
loom = { version = "0.7", optional = true }
linked_list_allocator = "0.10"

[features]
default = []
# v0.243.0（C-243）：BumpAllocator 并发模型验证（loom，host 侧；cfg(test) 专用）。
loom = ["dep:loom"]
