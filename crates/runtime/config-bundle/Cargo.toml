[package]
name = "eneros-config-bundle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS 蓝图 41 RuntimeConfigBundle：签名、类型化、可迁移运行配置唯一事实（no_std + alloc，target 可链接）"

[lib]
name = "eneros_config_bundle"
path = "src/lib.rs"

[dependencies]
# ADR-022：no_std target 唯一可链接国密实现（sm2_sign/sm2_verify/sm3_hash）。
eneros-crypto = { path = "../../security/crypto" }
# 63.3 WP-63.3.2：类型化验签原语收口（Ok(false) 布尔陷阱消除）。
eneros-signer-keyring = { path = "../../security/signer-keyring" }
# 蓝图 45 点表：地址直映 ProtocolAddress / ProtocolPointMapping（no_std；
# 复用既有工程量变换原语，禁重造——点模型仍仅 upa-model 唯一）。
eneros-protocol-abstract = { path = "../../protocols/protocol-abstract" }
# 蓝图 64 WP-64.1.2：协议配置键表单源（零依赖叶 crate；protocol.rs
# 未门控 → 进 target 闭包，仅 const 数组进 rodata，零运行时开销——
# 闭包审计见执行卡）。
eneros-protocol-keys = { path = "../../protocols/protocol-keys" }
eneros-upa-model = { path = "../../protocols/upa-model" }
# 蓝图 61：点身份绑定 unit_code 用 UnitCatalog 封闭码表（无环：telemetry-model
# 仅依赖 upa-model）。
eneros-telemetry-model = { path = "../../protocols/telemetry-model" }
# host 侧 TOML 编译面（feature `compile`；target 闭包不启用）。
toml = { version = "0.8", optional = true }

[features]
default = []
# host 侧 TOML → canonical 编译面（xtask config compile / 测试用）；target 闭包不启用。
compile = ["std", "dep:toml"]
std = []

[dev-dependencies]
toml = "0.8"
