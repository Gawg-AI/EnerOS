[package]
name = "eneros-root-task"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS seL4 root task — G2 closure + init bundle handoff (no_std, aarch64-unknown-none)"

[dependencies]
# 47（WP-47.1 编排驱动）：协议服务 EXECUTE 信封（drv-svc wire）。
eneros-drv-svc = { path = "../../drivers/drv-svc" }
eneros-tenant = { path = "../../agents/tenant" }
eneros-runtime = { path = "../runtime" }
eneros-boot-protocol = { path = "../../boot/boot-protocol" }
eneros-ipc-wire = { path = "../../abi/ipc-wire" }
# SPEC-B/C（2026-08-28）：移交 vaddr 常量单源（spawn re-use）。
eneros-handover-abi = { path = "../../abi/handover-abi" }
eneros-elf-loader = { path = "../../abi/elf-loader" }
eneros-sel4-sys = { path = "../sel4-sys" }
# 22 §2.W1.2：panic 审计（SHA-256 哈希链，36 WP-36.2 SM3→SHA-256 迁移）+ 看门狗复位（SP805）。
eneros-audit = { path = "../../security/audit" }
# 33 WP-33.5：掉电持久化启动计数（30 WP-30.7 机制接线）。
eneros-durable-log = { path = "../durable-log" }
eneros-watchdog = { path = "../../drivers/watchdog" }
eneros-time = { path = "../../drivers/time" }
# 23 G-I 总出口修复：Arm64Timer（CNTPCT_EL0 generic timer）→ time_init，
# supervisor 的 busy_wait/退避依赖单调时钟（此前未初始化恒 0 → 死循环）。
eneros-hal = { path = "../../hal/hal" }
# WP-27.2：驱动装配（FDT 解析 + 绑定表 + can/rs485 迁入绑定表）。
eneros-board = { path = "../../hal/board" }
eneros-driver-framework = { path = "../../drivers/framework" }
eneros-can = { path = "../../drivers/can" }
eneros-rs485 = { path = "../../drivers/rs485" }
eneros-uart = { path = "../../drivers/uart" }
eneros-storage = { path = "../../drivers/storage" }
eneros-crypto = { path = "../../security/crypto" }
# 39 WP-39.7：virtio-net 驱动（NetDevice seam；0x88b5 外部 peer 回显）。
eneros-net = { path = "../../drivers/net" }
# 蓝图 40 收尾：EIPC 客户端（分块传输 + 服务端点 cap——root 驱动控制链
# INGEST/TICK 用）+ 槽位常量（spawn 授予表）。
eneros-agent-sdk = { path = "../../agents/agent-sdk" }
# SPEC-B WP-B.1：墙钟 epoch 合理性闸门（time_gate 常量单一事实源——
# root 在 X6 下发前过闸；default-features 关闭 std/compile 面）。
eneros-config-bundle = { path = "../config-bundle", default-features = false }
# 蓝图 40 收尾：遥测样本构造（控制链采集代理 INGEST——39 设备句柄移交
# 前的 QEMU 装配路径；样本经 svc-telemetry evaluator 全量校验）。
eneros-safety-validator = { path = "../../ai/safety-validator" }
heapless = "0.8"
# 30 RT-004：init bundle 模块 sha256 校验（打包侧 xtask 用 sha2 0.10
# Sha256 写摘要——解析侧必须同算法；sha2 no_std 兼容）。
sha2 = { version = "0.10.9", default-features = false }
spin = "0.9"
linked_list_allocator = "0.10"

[features]
default = []
# 蓝图 40 收尾：target 构建启用 agent-sdk sel4 客户端（ipc_sel4 模块）。
# host 构建（lib 测试）不需要——xtask build_user_elf 特判传参。
sel4-eipc = ["eneros-agent-sdk/sel4"]
# 蓝图 45 WP-45.5（合成源降级）：仅 qemu-test 介质启用——root `control_chain_`
# 合成遥测 INGEST 注入（服务端/产线零合成路径）。qemu-prod/board-prod 等
# release 装配不传本 feature；closure gate `DENY_FEATURE_PATTERNS` 强制
# `qemu-test-synth` 不出现在 release 闭包（RELEASE_FEATURE_DENIED）。
qemu-test-synth = []
