[package]
name = "eneros-business-services"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS 蓝图 41 业务/运维 EL0 服务（svc-config/svc-ledger/svc-market/svc-ota/svc-observability/svc-cloud-sync/svc-agent-bus/svc-mgmt）"

[lib]
name = "eneros_business_services"
path = "src/lib.rs"

[dependencies]
# 服务循环（分块 EIPC + 心跳——40 模式）。
eneros-agent-sdk = { path = "../../agents/agent-sdk" }
eneros-sel4-sys = { path = "../../runtime/sel4-sys" }
eneros-drv-svc = { path = "../../drivers/drv-svc", features = ["heap-large"] }
eneros-storage = { path = "../../drivers/storage" }
eneros-runtime = { path = "../../runtime/runtime" }
# 41 基座：签名配置 bundle + 跨重启持久化。
eneros-config-bundle = { path = "../../runtime/config-bundle", default-features = false }
# 蓝图 61 v0.314.33：catalog 条目解码门禁（svc-config consumer）。
eneros-semantic-catalog = { path = "../../agents/semantic-catalog" }
eneros-crypto = { path = "../../security/crypto" }
eneros-durable-state = { path = "../../runtime/durable-state" }
# 市场/账本领域类型（44.4：settlement/account/p2p-match 为 0 引用假依赖已删）。
eneros-market-types = { path = "../../agents/market-types" }
# 系统 OTA 组件（真实 SM3/SM2 验签 + A/B 状态机）。
eneros-ota-ab = { path = "../../security/ota-ab" }
eneros-boot-protocol = { path = "../../boot/boot-protocol" }
# 可观测队列策略（drop policy 局部修复复用）。
eneros-telemetry-queue = { path = "../../observability/telemetry-queue" }
eneros-metrics = { path = "../../observability/metrics" }
eneros-logging = { path = "../../observability/logging" }
# MQTT AgentBus 消费者（client/QoS 复用）。
eneros-mqtt = { path = "../../protocols/mqtt", default-features = false }
# 管理 RPC 认证（TokenVerifier/RBAC 复用）。
eneros-mgmt-api = { path = "../../observability/mgmt-api" }
# 蓝图 61 v0.314.31（[07] §3.4）：市场事实经同一接入合同（SourceRegistry/
# RawObservation）进入事件平面。
eneros-ingestion-core = { path = "../../protocols/ingestion-core" }
eneros-telemetry-model = { path = "../../protocols/telemetry-model" }
# 蓝图 61 v0.314.32（[07] §4.6.3）：外部事实持久化 sink——认证事实经
# StoreFactEventSink 写分区事件日志（RPO=0、可恢复重放）。
eneros-event-store = { path = "../../runtime/event-store" }
# 40 服务循环模式（分块 EIPC + 心跳）。
eneros-control-services = { path = "../control-services" }
heapless = { version = "0.8", default-features = false }

[features]
default = []
# 41（WP-41.3 落盘）：EIPC 块客户端（Sel4IpcClient）target 构建启用；
# host 构建/测试不启用（sel4-sys 不进 host 依赖图）。
sel4 = ["eneros-agent-sdk/sel4"]

[[bin]]
name = "svc-config"
path = "src/bin/svc-config.rs"

[[bin]]
name = "svc-ledger"
path = "src/bin/svc-ledger.rs"

[[bin]]
name = "svc-market"
path = "src/bin/svc-market.rs"

[[bin]]
name = "svc-ota"
path = "src/bin/svc-ota.rs"

[[bin]]
name = "svc-observability"
path = "src/bin/svc-observability.rs"

[[bin]]
name = "svc-cloud-sync"
path = "src/bin/svc-cloud-sync.rs"

[[bin]]
name = "svc-agent-bus"
path = "src/bin/svc-agent-bus.rs"

[[bin]]
name = "svc-mgmt"
path = "src/bin/svc-mgmt.rs"

[dev-dependencies]
# [07] §3.5 合同套件（市场事实 adapter 合规测试）。
eneros-ingestion-core = { path = "../../protocols/ingestion-core", features = ["contract"] }
eneros-config-bundle = { path = "../../runtime/config-bundle", features = ["compile"] }
eneros-durable-state = { path = "../../runtime/durable-state" }
# 蓝图 61 Phase 6 §5.7 step 4：外部事实 → ObjectiveModule shadow 核对。
eneros-objective-engine = { path = "../../ai/objective-engine" }
eneros-decision-contract = { path = "../../ai/decision-contract" }
eneros-snapshot-service = { path = "../../agents/snapshot-service" }
eneros-semantic-catalog = { path = "../../agents/semantic-catalog" }
