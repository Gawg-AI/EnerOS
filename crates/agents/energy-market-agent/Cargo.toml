[package]
name = "eneros-energy-market-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.72.0 Energy Agent + Market Agent (双 Agent 协作 MVP, no_std) + v0.85.0 市场数据订阅 (现货/辅助服务/DR 订阅解析发布, no_std) + v0.86.0 报价生成 (LLM 意图+Solver 优化双脑报价/规则与保守回退, no_std) + v0.87.0 多设备调度 (设备池/LP 功率分配/平均分配兜底, no_std) + v0.88.0 多目标优化 (经济/寿命/安全/碳排加权和 + Pareto 前沿, no_std)"

[dependencies]
eneros-market-types = { path = "../market-types" }
eneros-agent = { path = "../agent" }
eneros-agent-sdk = { path = "../agent-sdk" }
eneros-dr = { path = "../dr" }
eneros-dual-brain = { path = "../../ai/dual-brain", features = ["coordinator"] }
eneros-fast-path = { path = "../../ai/fast-path" }
eneros-energy-lp-model = { path = "../../ai/energy-lp-model" }
eneros-solver-core = { path = "../../ai/solver-core", features = ["highs-ffi"] }
eneros-llm-engine = { path = "../../ai/llm-engine", features = ["llama-cpp"] }
eneros-safety-validator = { path = "../../ai/safety-validator" }
eneros-intent-contract = { path = "../../ai/intent-contract" }
# 蓝图 40 WP-40.6：唯一 ControlDispatch（唯一控制写出口）。
eneros-control-dispatch = { path = "../../protocols/control-dispatch" }
# 47（WP-47.1）：PointWriteIntent 类型（ControlDispatch::submit_intent 签名）。
eneros-protocol-abstract = { path = "../../protocols/protocol-abstract" }
# 蓝图 40：调用方角色（ActorKind）。
eneros-control-gateway = { path = "../../protocols/control-gateway" }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[features]
default = []
# v0.212.0（P0-27）：mock 仅测试/显式启用。
mock = ["eneros-dual-brain/mock", "eneros-solver-core/mock"]

[dev-dependencies]
# 测试模块使用 mock 求解器/双脑引擎（v0.212.0 P0-27 纪律）。
eneros-energy-market-agent = { path = ".", features = ["mock"] }

eneros-llm-engine = { path = "../../ai/llm-engine", features = ["mock"] }

# 21-B A2：真后端端到端测试（HighsSolver 经 new_real 装配）——测试构建
# 与 mock feature 共存（solver-core 的 release 熔断仅作用于非 debug）。
eneros-solver-core = { path = "../../ai/solver-core", features = ["highs-ffi"] }
