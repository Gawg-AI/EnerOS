[package]
name = "eneros-coordinator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.92.0+v0.93.0+v0.94.0 Edge Coordinator (域内仲裁 + 域级优化 + VPP 聚合, no_std)"

[dependencies]
# 蓝图 62 卷 62.3（S6 收敛）：容量聚合+分派数值纪律单源 kernel。
eneros-allocation = { path = "../allocation" }
eneros-market-types = { path = "../market-types" }
eneros-agent = { path = "../agent" }
eneros-solver-core = { path = "../../ai/solver-core", features = ["highs-ffi"] }
eneros-energy-market-agent = { path = "../energy-market-agent" }

[dev-dependencies]
# W4.1（蓝图23）：energy-market-agent 的 MarketSignal 等测试双已降级
# cfg(any(test, feature="mock"))——coordinator 测试需 mock feature 才能访问。
eneros-energy-market-agent = { path = "../energy-market-agent", features = ["mock"] }
