[package]
name = "eneros-device-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS v0.73.0 Device Agent (设备管理: 状态采集/命令执行/多设备, no_std)"

[features]
default = ["agent-runtime"]
# 蓝图/20 R2-1：Mock 类型仅测试/仿真；release 启用即熔断
mock = []
# AgentRuntime 桥接（DeviceAgent: AgentRuntime）——svc 闭包可关闭。
agent-runtime = ["dep:eneros-energy-market-agent"]
# 注册表持久化（FileSystem 实现绑定）。
persist-fs = ["dep:eneros-fs"]

[dependencies]
# 蓝图 40 诊断打印（target 服务侧）。
eneros-runtime = { path = "../../runtime/runtime" }
eneros-agent = { path = "../agent" }
# 蓝图 40 WP-40.4：AgentRuntime 桥接可选（svc-device-agent target 闭包
# 不需要 EnergyAgent 链——避免 llama/highs native 污染 target）。
eneros-energy-market-agent = { path = "../energy-market-agent", optional = true }
eneros-protocol-abstract = { path = "../../protocols/protocol-abstract" }
# v0.227.0（B3-04）：注册表持久化经 fs（蓝图 40：target 闭包可选——
# EL0 存储句柄移交后启用；svc 闭包不拉 littlefs C 构建）。
eneros-fs = { path = "../../drivers/fs", optional = true }
eneros-upa-model = { path = "../../protocols/upa-model" }
# 蓝图/24 §6.2/6.3：信封复验（ControlChain/租约/信封编解码）。
eneros-control-gateway = { path = "../../protocols/control-gateway" }
# 蓝图/24 §6.3：握手响应 HMAC 保护。
eneros-crypto = { path = "../../security/crypto" }
# 蓝图/24 §6.6：拒绝分类指标。
eneros-metrics = { path = "../../observability/metrics" }
# 蓝图/24 §6.6：写执行/拒绝/握手/租约签发审计事件（eneros-audit 兼容结构）。
eneros-audit = { path = "../../security/audit" }
# 指标注册定容字符串（与 metrics crate 同版本）。
heapless = { version = "0.8", default-features = false }
# FIX-24.R3：CTL-010 真实反馈（QualityFlag 为 reconcile 输入类型）。
eneros-telemetry-model = { path = "../../protocols/telemetry-model" }

[dev-dependencies]
# §8.2 场景④：指标 telemetry 导出验证（OtlpExporter 真实导出路径）。
eneros-telemetry-queue = { path = "../../observability/telemetry-queue" }
# 持久化测试（MockFileSystem）。
eneros-fs = { path = "../../drivers/fs" }
# WP-54.1：审计创世根单测独立复算（不与 eneros_audit::genesis 循环自证）。
sha2 = "0.10.9"
