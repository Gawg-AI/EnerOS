[package]
name = "eneros-federation"
description = "EnerOS v0.97.0 联邦发现 + v0.98.0 跨域通信通道（mTLS + 国密 SM2/SM3/SM4）+ v0.98.1 纵向加密认证 + v0.99.0 联邦共识协议（PBFT 变体）+ v0.100.0 资源争抢竞价（统一价格拍卖撮合 + 安全底线 + 共识确认） + v0.101.0 断网处理与孤岛模式（分区检测 + 交易冻结 + 本地自治缓存 + 恢复同步）"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# 蓝图/20 R2-1：Mock 类型仅测试/仿真；release 启用即熔断
mock = []
# Phase 7：真实 mTLS transport（svc-federation 与 E3 证据；std-only）
tls = ["dep:eneros-tls"]

[dependencies]
eneros-crypto = { path = "../../security/crypto" }
# 蓝图 62 卷 62.3（S5 收敛）：验签管线类型化单源。
eneros-signer-keyring = { path = "../../security/signer-keyring" }
# 蓝图 62 卷 62.3（S6 收敛）：包络/merit 序/有限性门数值纪律单源。
eneros-allocation = { path = "../allocation" }
eneros-tls = { path = "../../security/tls", optional = true }

[dev-dependencies]
eneros-tls = { path = "../../security/tls" }
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }

[[bin]]
name = "svc-federation"
path = "src/bin/svc-federation.rs"
required-features = ["tls"]
