[package]
name = "eneros-agent-sdk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS Agent SDK v1.0 (v0.164.0) — 稳定 Agent API + 生命周期 + IPC + 存储 + 日志, no_std"

[dependencies]
heapless = { version = "0.8", default-features = false }
eneros-ipc-wire = { path = "../../abi/ipc-wire" }
# 蓝图 45 WP-45.5：58B 遥测样本 wire（TelemetrySample/SampleQuality）。
eneros-safety-validator = { path = "../../ai/safety-validator" }
# 47（WP-47.4）：BlockIo（PersistIo 的 EIPC 块客户端）——control-services
# 与 business-services 共享同一适配（drv-svc 信封 + durable-state 契约）。
eneros-drv-svc = { path = "../../drivers/drv-svc" }
eneros-durable-state = { path = "../../runtime/durable-state" }
# SPEC-B/C（2026-08-28）：EipcBlockDevice（BlockIo→storage BlockDevice
# 单件）迁入——依赖方向已验无环（storage 不依赖 agent-sdk）。
eneros-storage = { path = "../../drivers/storage" }
# v0.224.0（B3-01）：seL4 IPC（仅目标构建启用）。
eneros-sel4-sys = { path = "../../runtime/sel4-sys", optional = true }

[features]
default = []
mock = []
# 真实 seL4 IPC 传输（目标构建）。
sel4 = ["dep:eneros-sel4-sys"]

[dev-dependencies]
eneros-sel4-sys = { path = "../../runtime/sel4-sys" }
