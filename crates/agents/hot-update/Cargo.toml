[package]
name = "eneros-agent-hot-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "EnerOS Agent 热更新 (v0.124.0) — no_std, 请求排空 + Arc 原子热切换 + SM3 模块校验 + 失败回滚"

