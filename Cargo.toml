[workspace.package]
version = "0.214.0"
edition = "2021"
authors = ["EnerOS Team"]
license = "MIT OR Apache-2.0"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
strip = true

# 用户态 EL0 程序：LTO+opt3 曾产生可疑的寄存器/控制流异常；降级为
# opt1 + 多 codegen units（内核本身保持 LTO）。证据正确性优先于尺寸。