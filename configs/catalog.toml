class = "setpoint"
min = -500.0
max = 500.0
ramp_kw_per_s = 3.3333     # 200 kW/min ÷ 60（与合同 1 同族）
settle_ms = 30000
min_on_ms = 0
min_off_ms = 0
max_starts = 1
