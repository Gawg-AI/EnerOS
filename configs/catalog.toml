asset_id = 3
schema_id = 1
unit = "kW"
role = "control"
readback_point_id = 1010

# --- 反馈槽（槽序 = TrustedFeedbackBuilder 字段声明序；单源） ---
[[feedback_slot]]
slot = "grid_up"
point_id = 5

[[feedback_slot]]
slot = "soc"
point_id = 4

[[feedback_slot]]
slot = "dc_bus_v"
point_id = 1

[[feedback_slot]]
slot = "overcurrent"
point_id = 6

[[feedback_slot]]
slot = "overtemp"
point_id = 7

# --- 安全覆盖（= SAFETY_COVERAGE_POINTS；点 4-7 无量纲 0..1） ---
[[coverage]]
point_id = 1
min = 0.0
max = 1000.0
period_ms = 5000
unit = "V"

[[coverage]]
point_id = 2
min = -1000.0
max = 1000.0
period_ms = 5000
unit = "A"

[[coverage]]
point_id = 3
min = 45.0
max = 55.0
period_ms = 5000
unit = "Hz"

[[coverage]]
point_id = 4
min = 0.0
max = 1.0
period_ms = 5000
unit = "ratio"

[[coverage]]
point_id = 5
min = 0.0
max = 1.0
period_ms = 5000
unit = "ratio"

[[coverage]]
point_id = 6
min = 0.0
max = 1.0
period_ms = 5000
unit = "ratio"

[[coverage]]
point_id = 7
min = 0.0
max = 1.0
period_ms = 5000
unit = "ratio"

# PCS-1 功率回读点（2026-09-14 / 70.15）：**必须进 coverage**——冻结快照的
# 必收点集（`SnapshotPolicy::required`）由本表派生（`coverage_config` →
# `CATALOG-COVERAGE points=`），而独立认证器判控制合同完整性的
# `readback_ok` 要求"合同回读点在本快照的受理观测里"。本表缺它 ⇒ 回读点
# 即使被采集也进不了快照 ⇒ 认证器恒判 `contract-incomplete` ⇒
# `dispatch=Committed` 恒 0（REG-70.15-CORE-CHAIN-SINGLE-GAP 的最后一环）。
# 窗宽与合同一致（控制设定点 −500..500 kW）；周期取点表的 5000ms。
[[coverage]]
point_id = 1001
min = -500.0
max = 500.0
period_ms = 5000
unit = "kW"

# --- 控制合同（无完整合同 → 可观测可预测，不可进入可控池） ---
[[control_contract]]
contract_id = 1
asset_id = 1
point_id = 10
unit = "kW"
class = "setpoint"
min = -500.0
max = 500.0
ramp_kw_per_s = 3.3333     # 200 kW/min ÷ 60（ControlProfile PCS_SETPOINT_MAX_RAMP）
settle_ms = 30000
min_on_ms = 0
min_off_ms = 0
max_starts = 1
readback_point_id = 1001
tolerance_kw = 0.1         # PCS_SETPOINT_READBACK_TOL_KW
reversible = true
compensation = false
priority = "remote"
safe_state = "hold"
lost_link = "hold"

# PCS-2 控制合同（蓝图 70 R10 多资产；±500 kW / ramp 与合同 1 同族）
[[control_contract]]
