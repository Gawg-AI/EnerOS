eta_c = 0.95
eta_d = 0.95
energy_max_kwh = 50.0
p_min_kw = -500.0             # 与 control_contract 2 一致（合同为最终收紧项）
p_max_kw = 500.0
q_min_kvar = 0.0
q_max_kvar = 0.0
ramp_up_kw_s = 3.3333
ramp_down_kw_s = 3.3333
soc_min = 0.05
soc_max = 0.95

# PCS-3 铭牌（蓝图 70 R10 三资源；30 kWh 电池）
[[nameplate]]
asset_id = 3
capacity_kwh = 30.0           # PCS-3 电池额定容量
eta_c = 0.95
eta_d = 0.95
