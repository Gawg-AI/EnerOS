# =====================================================================
# configs/catalog.toml — SemanticCatalog 编译源（蓝图 61 v0.314.33）
# =====================================================================
# 「schema、单位、资产、拓扑、点映射与控制合同」单一事实源：人类维护本
# 文件 → host 编译为签名 bundle "catalog" 条目（config-bundle
# `compile_catalog`）→ target 只读编译产物（semantic-catalog 解码面）。
#
# 与生产常量的对齐（parity 测试强制，禁止私自改键）：
#   grid_up=5 / soc=4 / dc_bus_v=1 / overcurrent=6 / overtemp=7
#     == control-dispatch `PROD_FEEDBACK_MAPPING`
#   coverage 1-7（min/max/period）== `SAFETY_COVERAGE_POINTS`
#   control_contract 1（−500..500 kW / ramp 200 kW/min / settle 30s /
#     readback=1001）== ControlProfile::ai_pcs_setpoint + PCS_SETPOINT_*
# 编译期交叉引用：重复 ID、悬空引用、控制点无回读、反馈槽不齐、
# 拓扑孤岛/自环、单位量纲不兼容 —— 全部编译错误。

generation = 1
valid_from_ns = 0
valid_until_ns = 0
mapping_version = 1
topology_version = 1
asset_version = 1
contract_version = 1
safety_version = 1

# --- schema 注册表（观察消息 schema_id/version 必须命中） ---
[[schema]]
id = 1
version = 1

# --- 受控换算图（量纲一致性由 UnitCatalog 强制；kW↔MW 可换，kW↔kWh 拒绝） ---
[[unit_conversion]]
from = "MW"
to = "kW"
factor = 1000.0

[[unit_conversion]]
from = "kW"
to = "MW"
factor = 0.001

# --- 资产目录（ID 永不复用；删除走 [[tombstone]]） ---
[[asset]]
asset_id = 1
site_id = 1
tenant_id = 1
kind = "battery"          # PCS-1 电池储能
device_id = 2             # 站内遥测网关（点 1-7）
topology_node_id = 2

[[asset]]
asset_id = 2
site_id = 1
tenant_id = 1
kind = "battery"           # PCS-2 电池储能（蓝图 70 R10 多资产）
device_id = 8              # PCS-2 控制设备（点 1005-1009；点表协议映射）
topology_node_id = 2       # 与 PCS-1 同 DER 母线

[[asset]]
asset_id = 3
site_id = 1
tenant_id = 1
kind = "battery"           # PCS-3 电池储能（蓝图 70 R10 三资源最低演示）
device_id = 9              # PCS-3 控制设备（点 1010-1014；点表协议映射）
topology_node_id = 2       # 与 PCS-1/2 同 DER 母线

[[asset]]
asset_id = 10
site_id = 1
tenant_id = 1
kind = "grid"
topology_node_id = 1

# --- 拓扑（静态；开关观测生成 energized view） ---
[[topology_node]]
id = 1
kind = "grid"

[[topology_node]]
id = 2
kind = "der"

[[topology_edge]]
from = 1
to = 2
kind = "switch"           # 并网点开关：状态观测点 = grid_up（点 5）
switch_point_id = 5
capacity_kw = 500.0
loss = 0.0

