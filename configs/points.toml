# --- 来源注册表（蓝图 61 v0.314.27：身份由签名配置分配，binary 零硬编码） ---
# source 1 = root 合成源（REG-70.8-SYNTH-NO-OBS 解封，2026-09-15）：合成馈电
# 升级为 **OBS 生产轨**测试设施——qemu-test-synth 装配下 root 以 TEL_INGEST_OBS
# 发 source=1 观测事件（flags=SIMULATED|TEST、epoch=0，decode 门允许），
# 使"观测→冻结快照→独立认证→dispatch"全链在合成装配可证（R09/R10 前置）。
# 旧行为（只走旧 TelemetrySample 兼容轨、永不产 ObservationEvent）被本行取代；
# release 闭包门强制 `qemu-test-synth` 不在 release 装配 ⇒ 生产无任何路径以
# source 1 发帧（本行在生产不可达，仅身份登记）。
[[source]]
source_id = 1
protocol = "synth"
tenant_id = 1
site_id = 1
allow_control = true
require_integrity = true
# 授权面 = 合成馈电声明点跨度（1..7 网关遥测 + 1001..1004 PCS-1 +
# 1005..1009 PCS-2【蓝图 70 R10】，同 source 2 的"声明点 id 跨度"规则；
# 非"放宽到不设界"）。
point_min = 1
point_max = 1014
max_events_per_s = 100

# source 2 = svc-modbus-tcp 真实采集适配器（45.5 生产先行链；绑定 PCS-1
# asset_id=1 + PCS-2 asset_id=2【蓝图 70 R10】的 modbus-tcp 点域 1..=1009；
# L2 测试链完整性=LocalTrustedEdge）。
[[source]]
source_id = 2
protocol = "modbus-tcp"
tenant_id = 1
site_id = 1
allow_control = true
require_integrity = true
point_min = 1
point_max = 1014
max_events_per_s = 100

# 蓝图 62 卷 62.2（D-1 判据前置）：iec104 来源身份登记——61 卷接入时
# 点表三行已注册而 source 行遗漏，svc-iec104 因 own_source_id=None 诚实
# 退壳（EXECUTE ST_UNAVAILABLE），采集轮无法产出事件。补行激活身份三事实
#（source_id/epoch/mapping_version——[07] §2.4）。
[[source]]
source_id = 3
protocol = "iec104"
tenant_id = 1
site_id = 1
allow_control = false
require_integrity = true
point_min = 3001
point_max = 3003
max_events_per_s = 100
