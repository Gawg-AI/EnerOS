# --- 控制链遥测网关（modbus-tcp 从站 2，eth0；45.5 真实采集先行链） ---
# 点 1-6 与 svc-telemetry 可信评估覆盖/绑定一致（Volt/Ampere/Hertz/Ratio/
# Other/Other；source=1；require_integrity）。寄存器/缩放取 45 QEMU 从站
# （evidence/45/modbus_slave.py）应答值经 scale×raw → 落在信任量程内。
[[point]]
point_id = 1
device_id = 2
protocol = "modbus-tcp"
addr.modbus = { slave_addr = 2, reg_addr = 0x0100, func_code = 3 }
data_type = "analog"
scale = 0.1
offset = 0.0
