# EnerOS 国密硬件加密引擎配置 (v0.158.0)
#
# 配置加密引擎选择策略和硬件参数。
# 硬件优先 + 软件 fallback 策略。

[engine]
# 引擎选择策略: "hardware_first" | "software_only" | "hardware_only"
strategy = "hardware_first"

# 硬件操作超时（毫秒）
timeout_ms = 100

# 硬件故障时自动 fallback 到软件
auto_fallback = true

# 连续失败多少次后禁用硬件引擎（0 = 不禁用）
max_consecutive_failures = 5

[phytium]
# 飞腾 D2000 加密引擎
enabled = true
base_address = 0x28200000
# DMA 缓冲区大小（字节，4KB 对齐）
dma_buffer_size = 4096
# 中断模式: "polling" | "interrupt"
irq_mode = "polling"

[kunpeng]
# 鲲鹏 920 KAE 加速引擎
enabled = true
base_address = 0x40000000
# KAE 队列深度
queue_depth = 64
# DMA 缓冲区大小
dma_buffer_size = 4096

[software]
# 软件 fallback 引擎（始终可用）
enabled = true

[sm4]
# SM4 默认工作模式: "ecb" | "cbc" | "ctr" | "gcm"
default_mode = "cbc"
# 密钥轮换间隔（秒，0 = 不自动轮换）
key_rotation_secs = 0

[performance]
# 性能基准阈值（用于验证硬件加速效果）
# SM3 最低吞吐量 (Mbps)
sm3_min_throughput_mbps = 1000
# SM4 最低吞吐量 (Mbps)
sm4_min_throughput_mbps = 2000
# SM2 签名最大延迟 (ms)
sm2_max_sign_latency_ms = 5
# 硬件加速最低倍数（相对软件）
min_acceleration_factor = 10

[security]
# 操作完成后清零 DMA 缓冲区
zeroize_dma_after_use = true
# 操作完成后清零密钥寄存器
zeroize_key_after_use = true
# 禁止在日志中输出密钥材料
no_key_logging = true
