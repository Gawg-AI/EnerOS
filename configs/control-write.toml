# consumer: crates/agents/device-agent/src/assembly_demo.rs（唯一真实加载方，测试路径）
# 蓝图/24 §6.7 控制写配置（control-write）
# HMAC 密钥不在本文件（§2.6：只经装配层注入，不落明文、不进镜像）。

[control_write]
# 本地预置租约 ID：16 字节 hex，两侧同源（device-agent 复验 / AI runner 签发），
# 产线烧录（batch_config）。不得动态生成——两侧必须同源（D7）。
lease_id = "33112233445566778899aabbccddeeff"

# 旧匿名输入过渡期策略：唯一合法值 "deny-and-log"（收到不执行、记指标+审计）。
# 删除闸门（§6.5：WP-24.5 后一版本）到期后移除本键。
legacy_input = "deny-and-log"

# 启动握手客户端有界重试次数（≤5；失败 fail-closed 报 Offline，§6.3）。
handshake_retries = 5

# 47（WP-47.1 速率可调）：dispatch rate gate 每小时确认配额。
# 缺省（移除本键）= 产品默认 60/h；此处为 QEMU 演示放宽值
#（demo 驱动频率下 AI 链每秒多轮，60/h 数十秒即撞限）——release 部署
# 必须移除本键或设为产品值。
rate_per_hour = 100000
