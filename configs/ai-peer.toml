# 49（WP-49.2 远程 dual-brain，ADR-0045 方案 B）：svc-ai-worker RemoteBrain
# 状态机参数。**六键全必配**（fail-closed 禁凭记忆缺省——48 卷数值纪律同款，
# 编译/解码两侧同值域校验；SPEC-E WP-E.3 增 learn_enabled 闸键）。
#
# 宣称纪律（ADR-0045 #4）：本链路 = 「AI 辅助决策（需配套站端服务）」；
# peer 应答为不受信输入，越权提案在契约层拒绝。
[ai_peer]
# timeout_ms：产品缺省语义 5s（蓝图默认）；本装配为 QEMU 演示节拍
# （root 控制链/协议 EXECUTE 周期 ≈13s/tick，应答投递延迟 ≤1 周期）
# 配 30s——「可配」判据的正当使用（46 卷 keep_alive_ms=3000 同款先例，
# 产线按现场决策周期重订）。unhealthy_after=3 ⇒ 断链 ~90s 内降级。
timeout_ms = 30000
unhealthy_after = 3
probe_every = 5
max_power_kw = 5.0
ttl_secs = 30
# SPEC-E WP-E.3：有界学习闸（EAQ-2：dev/qemu 装配 = true；release 产物
# 的装配配置归 owner 拍板——false ⇒ 零学习零持久，System1 阈值恒出厂，
# 行为 byte-equal 旧链路）。
learn_enabled = true
# 68.5（WP-68.5.3）：D3 降级 lease 有效时长秒——peer 失联后 System1 兜底
# 持签降级窗；到期不复位即拒降级维持（fail-closed，D3 语义）。键本体
# **不落 TOML**（compile_security 同款注入链，configs/kms-dev/degrade-lease.key
# 开发档模板）。
degrade_lease_ttl_secs = 86400
# 蓝图 70.10 WP-70.10.2 + ADR-0054:34–35（2026-09-18 R10 复查订正）：
# 结构化计划参数四键全给（部分给 = 配置错）——激活 v2 结构化请求轨：
# AI worker 以可信快照派生规格（逐资产 nameplate×合同×预算钳制）向
# peer 发 v2 请求，应答按 binds 逐字段验收后进认证/投递（used=true 面）。
# ADR-0054：快照产出后 30s 控制窗是安全事实——时域收敛为 4×7s=28s ≤
# 30s（上一轮 4×15s=60s 放宽窗已回退；ttl_secs 与控制窗对齐 30s，证书
# valid_until = horizon_start + ttl ≤ 包络末）。单批分配 ≤ 8（DEC-70-13 ②，
# 编译器 max_commands_per_batch 单源）；计划级 inline 上限 = 64（蓝图 08
# §9；PEER_PLAN_MAX_ASSIGNMENTS 单源）。3 资产 × 4 步 = 12 分配 ⇒
# 编译拆 2 批，逐步窗 [horizon+(k-1)·7s, horizon+k·7s) 内 tick 推进。
# recheck 收口轮（2026-09-20）：7s → 2s——步距 7s 时计划时跨（4×7=28s）
# 超过冻结快照轮转窗（实测 5.8~20s），非合并计划的后继步在步窗到期前
# 就被「输入不再有效」取消（vol4-R3 锚后零 Committed / R10 非合并窗全灭
# 的共同根因）；2s 步 ⇒ 跨度 6s < 轮转窗，且步内爬坡 5kW/2s=2.5kW/s
# < 合同 3.333kW/s。合并语义/容量/12 分配合同不变。
plan_step_ns = 2_000_000_000
plan_steps = 4
plan_objective = "min_cost"
plan_prices_per_kwh = [0.5, 0.6, 0.4, 0.45]
